<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>행복한 왕자 : 사라지는 도시</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;600;700&display=swap');

:root {
  /* 고딕 미스터리 — 명탐정 코난 붉은 복도, 횃불, 석조 */
  --bg:      #0d0704;          /* 아주 어두운 적갈색 검정 */
  --border:  #2a1810;
  --white:   #f5ede0;          /* 불빛에 비친 따뜻한 흰색 */
  --ivory:   #eee0c8;
  --cream:   #d8c8a8;
  --mist:    #a08060;
  --fog:     #604830;
  --shadow:  #2e1a0e;
  --gold:    #e8841a;          /* 횃불 주황 */
  --gold2:   #a85010;          /* 어두운 불꽃 */
  --sage:    #c87830;          /* 불꽃 황갈 */
  --slate:   #904828;          /* 적갈 */
  --crimson: #cc2020;          /* 선혈 붉은색 */
  --serif:   'Nanum Myeongjo', serif;
  --title:   'Nanum Myeongjo', serif;
  --mono:    'DM Mono', monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);font-family:var(--serif);min-height:100vh;overflow-x:hidden;color:var(--cream);}

/* 고딕 벽돌 그레인 오버레이 */
body::after{
  content:'';
  position:fixed;inset:0;z-index:1;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(180,60,10,0.025) 3px,
      rgba(180,60,10,0.025) 4px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 3px,
      rgba(100,30,5,0.015) 3px,
      rgba(100,30,5,0.015) 4px
    );
  pointer-events:none;
}

#curtain{
  position:fixed;inset:0;z-index:300;
  background:#0d0704;opacity:0;pointer-events:none;
  transition:opacity 0.45s ease;
}
#curtain.show{opacity:1;pointer-events:all;}

/* ══════════════════════
   타이틀
══════════════════════ */
#title-screen{
  position:fixed;inset:0;z-index:100;
  overflow:hidden;background:var(--bg);
}

/* 타이틀 배경: 어두운 창고/폐공장 내부 — 잿빛+파란 빛 */
.title-bg-img{
  position:absolute;inset:0;
  /* 어두운 산업 공간 — 잿빛 */
  background-image:url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1800&q=90&fm=jpg');
  background-size:cover;
  background-position:center 50%;
  filter:brightness(0.18) saturate(0.12) hue-rotate(200deg) contrast(1.2);
  animation:bgDrift 22s ease-in-out infinite alternate;
}
@keyframes bgDrift{
  0%  {background-position:50% 48%;}
  50% {background-position:51% 52%;}
  100%{background-position:50% 50%;}
}

/* 타이틀 배경 레이어2: 횃불 붉은 오버레이 */
.title-bg-overlay{
  position:absolute;inset:0;
  background-image:url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1800&q=85&fm=jpg');
  background-size:cover;
  background-position:center 60%;
  filter:brightness(0.2) saturate(1.2) sepia(1) hue-rotate(330deg) contrast(1.4);
  mix-blend-mode:screen;
  opacity:0.55;
  animation:overlayDrift 28s ease-in-out infinite alternate;
}
@keyframes overlayDrift{
  0%  {opacity:0.34;}
  50% {opacity:0.42;}
  100%{opacity:0.36;}
}

/* 왕자 동상 이미지 레이어 (가운데) — 잿빛 실루엣 */
.title-statue{
  position:absolute;
  bottom:0;left:50%;
  transform:translateX(-50%);
  width:clamp(180px,24vw,340px);
  height:clamp(300px,54vh,580px);
  background-image:url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=800&q=90&fm=jpg');
  background-size:cover;
  background-position:center 10%;
  /* 차갑고 잿빛인 실루엣 — 파란 윤곽 */
  filter:brightness(0.30) saturate(0.4) sepia(0.6) hue-rotate(340deg) contrast(1.5);
  mask-image:linear-gradient(to top, #0d0704 0%, transparent 10%, transparent 80%, rgba(13,7,4,0.4) 100%);
  -webkit-mask-image:linear-gradient(to top, #0d0704 0%, transparent 10%, transparent 80%, rgba(13,7,4,0.4) 100%);
  animation:statueFloat 7s ease-in-out infinite;
}
@keyframes statueFloat{
  0%,100%{transform:translateX(-50%) translateY(0px);}
  50%{transform:translateX(-50%) translateY(-7px);}
}

/* 그라데이션 오버레이들 */
.title-vignette{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 25%, rgba(4,4,10,0.65) 100%),
    linear-gradient(to bottom, rgba(4,4,10,0.6) 0%, transparent 25%, transparent 55%, rgba(4,4,10,0.98) 90%);
}

/* 횃불 후광 (동상 위) */
.title-glow{
  position:absolute;
  bottom:clamp(160px,28vh,300px);
  left:50%;transform:translateX(-50%);
  width:clamp(120px,22vw,260px);
  height:clamp(80px,14vw,160px);
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(232,132,26,0.22) 0%, rgba(180,60,10,0.10) 50%, transparent 75%);
  animation:glowPulse 3s ease infinite;
}
@keyframes glowPulse{
  0%,100%{opacity:1;transform:translateX(-50%) scale(1);}
  50%{opacity:0.45;transform:translateX(-50%) scale(1.2);}
}

.title-content{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0 24px 20px;
  text-align:center;
}

/* 순차 등장 애니메이션 */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(22px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes lineGrow{
  from{height:0;opacity:0;}
  to{height:44px;opacity:1;}
}

.t-eye{
  font-family:var(--mono);font-size:9px;
  letter-spacing:0.44em;color:var(--fog);
  margin-bottom:14px;text-transform:uppercase;
  opacity:0;
  animation:fadeIn 1s ease 0.4s forwards;
}

.t-main{
  font-family:var(--title);
  font-size:clamp(44px,9.5vw,82px);
  font-weight:700;line-height:0.95;
  color:var(--ivory);letter-spacing:0.1em;
  text-shadow:0 2px 40px rgba(232,132,26,0.2), 0 0 80px rgba(0,0,0,0.9);
  margin-bottom:10px;
  opacity:0;
  animation:fadeUp 1.2s ease 0.8s forwards;
}

.t-kr{
  font-family:var(--serif);
  font-size:clamp(12px,2.2vw,17px);
  color:var(--fog);letter-spacing:0.28em;
  margin-bottom:36px;
  opacity:0;
  animation:fadeIn 1s ease 1.6s forwards;
}

.t-line{
  width:1px;height:0;
  background:linear-gradient(to bottom,var(--gold2),transparent);
  margin:0 auto 24px;
  opacity:0;
  animation:lineGrow 0.8s ease 2.2s forwards;
}

.t-desc{
  font-size:13px;font-weight:400;
  color:var(--mist);line-height:2.05;
  max-width:310px;margin-bottom:52px;
  opacity:0;
  animation:fadeUp 1s ease 2.6s forwards;
}

.start-btn{
  all:unset;cursor:pointer;
  font-family:var(--mono);font-size:10px;
  letter-spacing:0.34em;text-transform:uppercase;
  color:var(--bg);background:var(--ivory);
  padding:15px 50px;
  transition:all 0.38s;
  opacity:0;
  animation:fadeUp 1s ease 3.2s forwards;
}
.start-btn:hover{background:#f8f4ec;letter-spacing:0.48em;}

/* ══════════════════════
   HUD
══════════════════════ */
#game{display:none;}
#hud{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:10px 36px 8px;
  display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;
  background:linear-gradient(to bottom,rgba(13,7,4,0.97) 55%,transparent);
  border-bottom:1px solid rgba(28,28,40,0.9);
}
.hud-logo{
  font-family:var(--serif);font-size:13px;
  letter-spacing:0.12em;color:var(--cream);
  margin-right:auto;opacity:0.85;
}
.stat{display:flex;flex-direction:column;gap:5px;min-width:80px;}
.stat-lbl{font-family:var(--mono);font-size:11px;letter-spacing:0.22em;color:var(--fog);}
.bw{height:3px;background:var(--border);overflow:hidden;}
.bar{height:100%;transition:width 0.85s cubic-bezier(0.4,0,0.2,1);}
.bar.i{background:#c07030;}
.bar.s{background:#7a8898;}
.bar.n{background:#a84040;}
.stat-num{font-family:var(--mono);font-size:17px;color:var(--cream);}
.flags{display:flex;gap:7px;padding-bottom:1px;}
.flag{font-family:var(--mono);font-size:11px;padding:3px 9px;border:1px solid rgba(150,130,100,0.4);color:rgba(150,130,100,0.7);letter-spacing:0.1em;transition:all 0.4s;}
.flag.on{border-color:var(--gold);color:var(--gold);background:rgba(232,132,26,0.1);}

/* ══════════════════════════════════════
   씬 레이아웃 — 화면 꽉 채우기
══════════════════════════════════════ */
#scene-wrap{
  position:fixed;
  top:56px;left:0;right:0;bottom:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── 이미지 패널 ── */
.s-img{
  width:100%;
  max-width:900px;
  margin:0 auto;
  height:38%;
  flex:0 0 38%;
  position:relative;
  overflow:hidden;
  display:block;
  border:1px solid rgba(232,132,26,0.12);
}
.s-img svg{
  position:absolute;inset:0;
  width:100%;height:100%;display:block;
}
.s-img::before{
  content:'장면';
  position:absolute;top:12px;left:14px;z-index:10;
  font-family:'Nanum Myeongjo',serif;
  font-size:9px;letter-spacing:0.18em;
  color:rgba(232,132,26,0.55);
  border:1px solid rgba(232,132,26,0.2);
  padding:2px 8px;pointer-events:none;
}
.s-img::after{
  content:'';position:absolute;
  bottom:0;left:0;right:0;height:40%;
  background:linear-gradient(to bottom,transparent,var(--bg));
  pointer-events:none;z-index:2;
}
.s-img .scene-badge{
  position:absolute;top:12px;right:14px;z-index:10;
  font-family:var(--serif);font-size:13px;letter-spacing:0.08em;
  color:rgba(232,132,26,0.85);pointer-events:none;
  font-weight:700;
  text-shadow:0 2px 8px rgba(0,0,0,0.9);
}
.s-img .scene-overlay{
  position:absolute;bottom:0;left:0;right:0;z-index:5;
  padding:30px 20px 14px;
  display:flex;flex-direction:column;gap:3px;
  background:linear-gradient(to bottom,transparent,rgba(10,3,1,0.95));
  pointer-events:none;
}
.s-img .scene-overlay .ov-eye{
  display:none;
}
.s-img .scene-overlay .ov-title{
  display:none;
}
.s-img .tint{position:absolute;inset:0;mix-blend-mode:multiply;}

.s-body{
  flex:1;
  min-height:0;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:16px 60px 12px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* 씬 헤더 */
.s-eye{font-family:var(--mono);font-size:11px;letter-spacing:0.3em;color:var(--fog);margin-bottom:4px;text-transform:uppercase;}
.s-title{font-family:var(--serif);font-size:clamp(26px,3.8vw,36px);font-weight:700;line-height:1.05;color:var(--ivory);margin-bottom:4px;}
.s-title em{font-style:italic;color:var(--gold);}
.s-place{font-family:var(--mono);font-size:11px;color:var(--fog);letter-spacing:0.1em;line-height:1.5;}
.cond{
  margin-top:5px;padding:5px 12px;margin-bottom:6px;
  border-left:2px solid var(--gold2);
  background:rgba(232,132,26,0.06);
  font-family:var(--mono);font-size:11px;
  color:var(--gold);letter-spacing:0.06em;line-height:1.75;
}

/* 서사 */
.narr{padding:10px 0 8px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);margin-top:10px;flex:1;min-height:0;overflow:hidden;}
.sd{font-family:var(--mono);font-size:11px;color:var(--fog);letter-spacing:0.07em;line-height:1.72;border-left:1px solid var(--border);padding-left:14px;}
.dlg{display:flex;flex-direction:column;gap:6px;}
.spk{font-family:var(--mono);font-size:11px;letter-spacing:0.3em;text-transform:uppercase;}
.spk.pr{color:var(--gold);}
.spk.sw{color:var(--sage);}
.spk.mg{color:var(--slate);}
.spk.pz{color:var(--crimson);}
.spk.fy{color:#c090e0;}
.line{
  font-family:var(--serif);
  font-size:clamp(15px,1.6vw,18px);
  font-weight:400;line-height:1.82;
  color:var(--white);letter-spacing:0.01em;
}
.rule{
  height:1px;flex-shrink:0;
  background:linear-gradient(to right,transparent,var(--border) 20%,var(--border) 80%,transparent);
  margin:10px 0;
}

/* 선택지 */
.choices{padding:12px 0 8px;display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;flex-shrink:0;}
.c-head{
  font-family:var(--mono);font-size:8px;
  letter-spacing:0.24em;color:var(--fog);
  text-transform:uppercase;margin-bottom:3px;
}
.cbtn{
  all:unset;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;
  flex:1;min-width:180px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.01);
  position:relative;overflow:hidden;
  transition:transform 0.18s ease,border-color 0.18s,background 0.18s;
}
.cbtn::before{
  content:'';position:absolute;left:0;top:0;right:0;height:2px;
  background:var(--gold);opacity:0;transition:opacity 0.18s;
}
.cbtn:hover{transform:translateY(-3px);border-color:rgba(232,132,26,0.4);background:rgba(232,132,26,0.05);}
.cbtn:hover::before{opacity:1;}
.cbtn:hover .ck{color:var(--gold);}
.cbtn.bad::before{background:var(--crimson);}
.cbtn.bad:hover{border-color:rgba(204,32,32,0.4);background:rgba(204,32,32,0.06);}
.cbtn.bad:hover .ck{color:var(--crimson);}
.ck{font-family:var(--mono);font-size:13px;color:var(--mist);min-width:26px;flex-shrink:0;transition:color 0.18s;}
.cc{display:flex;flex-direction:column;gap:2px;}
.cm{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ivory);line-height:1.3;}
.cd{font-family:var(--serif);font-size:13px;color:var(--mist);line-height:1.4;}
.ce{font-family:var(--mono);font-size:11px;color:var(--sage);letter-spacing:0.06em;}
.cbtn.bad .ce{color:var(--crimson);}
.warn-b{
  flex-shrink:0;padding:5px 10px;
  border-left:2px solid var(--crimson);
  background:rgba(204,32,32,0.07);
  font-family:var(--mono);font-size:9px;
  color:var(--crimson);letter-spacing:0.05em;line-height:1.5;
  margin-bottom:4px;animation:wp 2.5s ease infinite;
}
@keyframes wp{0%,100%{opacity:1}50%{opacity:0.45}}

/* 엔딩 */
.end-wrap{
  flex:1;min-height:0;overflow:hidden;
  padding:14px 0 8px;
  display:flex;flex-direction:column;gap:10px;
  animation:eIn 1.2s ease forwards;
}
@keyframes eIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.end-tag{font-family:var(--mono);font-size:8px;letter-spacing:0.26em;color:var(--fog);text-transform:uppercase;flex-shrink:0;}
.end-title{font-family:var(--serif);font-size:clamp(20px,3vw,34px);font-weight:700;line-height:1.05;flex-shrink:0;}
.end-title.bad  {color:var(--crimson);}
.end-title.rev  {color:var(--gold);}
.end-title.integ{color:var(--sage);}
.end-text{
  font-family:var(--serif);font-size:clamp(12px,1.4vw,15px);
  font-weight:400;line-height:1.75;color:var(--cream);
  border-left:2px solid var(--border);padding-left:14px;flex-shrink:0;
}
.end-stats{
  display:flex;gap:24px;flex-shrink:0;
  padding:10px 0;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.es{display:flex;flex-direction:column;gap:5px;}
.esl{font-family:var(--mono);font-size:8px;letter-spacing:0.22em;color:var(--fog);}
.esv{font-family:var(--mono);font-size:18px;}
.restart-btn{
  all:unset;cursor:pointer;flex-shrink:0;
  font-family:var(--mono);font-size:9px;
  letter-spacing:0.2em;color:var(--fog);
  border:1px solid var(--border);
  padding:8px 20px;text-transform:uppercase;
  transition:all 0.24s;align-self:flex-start;
}
.restart-btn:hover{color:var(--ivory);border-color:var(--mist);}
.scene-in{animation:sIn 0.7s ease forwards;}
@keyframes sIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="curtain"></div>

<!-- ══ 타이틀 ══ -->
<div id="title-screen">
  <!-- 배경 레이어1: 어두운 안개 골목 -->
  <div class="title-bg-img"></div>
  <!-- 배경 레이어2: 희미한 가로등 안개 (screen blend) -->
  <div class="title-bg-overlay"></div>
  <!-- 왕자 동상 실루엣 -->
  <div class="title-statue"></div>
  <!-- 황금 후광 -->
  <div class="title-glow"></div>
  <!-- 비네팅 -->
  <div class="title-vignette"></div>

  <div class="title-content">
    <p class="t-eye">Oscar Wilde · Interactive Fiction · Mystery</p>
    <h1 class="t-main">THE HAPPY<br>PRINCE</h1>
    <p class="t-kr">행복한 왕자 — 사라지는 도시</p>
    <div class="t-line"></div>
    <p class="t-desc">
      움직일 수 없는 왕자가 녹슨 심장으로<br>
      도시를 살리거나 파괴하는<br>
      15분의 비극.
    </p>
    <button class="start-btn" onclick="startGame()">시작하다 →</button>
  </div>
</div>

<!-- ══ 게임 ══ -->
<div id="game">
  <div id="hud">
    <span class="hud-logo">행복한 왕자 — 사라지는 도시</span>
    <div class="stat">
      <span class="stat-lbl">INTEGRITY</span>
      <div class="bw"><div class="bar i" id="bar-i" style="width:0%"></div></div>
      <span class="stat-num" id="val-i">0</span>
    </div>
    <div class="stat">
      <span class="stat-lbl">SYNC</span>
      <div class="bw"><div class="bar s" id="bar-s" style="width:0%"></div></div>
      <span class="stat-num" id="val-s">0</span>
    </div>
    <div class="stat">
      <span class="stat-lbl">NOISE</span>
      <div class="bw"><div class="bar n" id="bar-n" style="width:0%"></div></div>
      <span class="stat-num" id="val-n">0</span>
    </div>
    <div class="flags">
      <span class="flag" id="f-s2a">S2A</span>
      <span class="flag" id="f-s3a">S3A</span>
      <span class="flag" id="f-key">KEY</span>
    </div>
  </div>
  <div id="scene-wrap"></div>
</div>

<script>
/* ── 상태 ── */
let G={i:0,s:0,n:0,s2a:false,s3a:false,key:false};
const MAX=60;
function ch(k,d){G[k]=Math.max(0,G[k]+d);hud();}
function hud(){
  ['i','s','n'].forEach(k=>{
    document.getElementById('val-'+k).textContent=G[k];
    document.getElementById('bar-'+k).style.width=Math.min(100,(G[k]/MAX)*100)+'%';
  });
  document.getElementById('f-s2a').classList.toggle('on',G.s2a);
  document.getElementById('f-s3a').classList.toggle('on',G.s3a);
  document.getElementById('f-key').classList.toggle('on',G.key);
}
function go(fn){
  const c=document.getElementById('curtain');
  c.classList.add('show');

    <div class="dlg"><span class="spk fy">Fairy</span><p class="line">"네 선택의 무게를 재어보겠다."</p></div>
    <div class="dlg"><span class="spk pz">PZ</span><p class="line">"개입 로그 총 ${G.i+G.s}점. 임계치 ${thr*2}점."</p></div>
    <p class="sd">저울이 기울기 시작한다. 왕자의 코어가 최대 명도로 점멸한다.</p>`;
  const warn=!ok?`<div class="warn-b">[ Warning ] 현재 수치 부족 — 승리 조건 미달.</div>`:'';
  const ch_=(ok
    ?btn('→','코어 이동 — 승리 확정',`Integrity ${G.i} / Sync ${G.s} → 조건 충족`,'S6으로 진행',"cs5('win')")
    :btn('→','코어 이동 — 승리 시도',`Integrity ${G.i} / Sync ${G.s} → 조건 미달`,'실패 가능성 높음',"cs5('win')",true))
  +btn('G','도박','모든 것을 걸고 50% 확률에 도전한다','Sync −10 · 50% 성공/실패',"cs5('gamble')",true)
  +btn('↩B','S4 재시작','관리자 접근으로 돌아간다','',"cs5('b4')")
  +btn('↩C','S3 재시작','금빛 광장으로 돌아간다','',"cs5('b3')");
  render(scene('s5','Scene 05 / 전(轉) — 절정','<em>최종 코어</em> — 선녀 vs PZ',`빛나는 저울 홀로그램 · ${sub}`,'',narr,warn+ch_));
}
function cs5(c){
  if(c==='win'){const t=G.key?30:38;(G.i>=t||G.s>=t)?go(sceneS6):go(badEnd);}
  else if(c==='gamble'){ch('s',-10);Math.random()<0.5?go(sceneS6):go(badEnd);}
  else if(c==='b4')go(sceneS4);
  else if(c==='b3')go(sceneS3);
}

function sceneS6(){
  if(G.s>=45)go(endA);
  else if(G.i>=45)go(endB);
  else go(badEnd);
}

function endA(){
  render(ending('endA',
    'End_A / Sync ≥ 45 / Clear','rev','혁명가형',
    '왕자는 녹슬고 부서졌으나,<br>도시의 눈에서 눈물이 흘렀다.<br><br>시스템은 리부트되었다.<br>균열에서 빛이 새어나왔다.<br>이름 없는 자들이 광장에 모였다.'));
}
function endB(){
  render(ending('endB',
    'End_B / Integrity ≥ 45 / Clear','integ','인간성 회복',
    '시민들이 왕자의 상처를 닦아주었다.<br><br>코어의 붉은 명멸은 멈추었고,<br>대신 조용하고 따뜻한 박동이 시작되었다.<br>제비 한 마리가 탑 위에서 봄을 노래했다.'));
}
function badEnd(){
  render(ending('bad',
    'Bad End / Failed','bad','도시가 정지했다',
    '"제비야, 미안하다."<br><br>왕자의 코어가 꺼졌다.<br>도시의 불빛도 하나씩 꺼져갔다.<br>광장에는 아무도 남지 않았다.'));
}

function startGame(){
  document.getElementById('title-screen').style.display='none';
  document.getElementById('game').style.display='block';
  sceneS1();
}
function restartGame(){
  G={i:0,s:0,n:0,s2a:false,s3a:false,key:false};
  hud();go(sceneS1);
}
</script>
</body>
