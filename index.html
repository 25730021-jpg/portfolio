<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>행복한 왕자 : 사라지는 도시</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;600;700&display=swap');

:root {
  /* 고딕 미스터리 — 명탐정 코난 붉은 복도, 횃불, 석조 */
  --bg:      #0d0704;          /* 아주 어두운 적갈색 검정 */
  --border:  #2a1810;
  --white:   #f5ede0;          /* 불빛에 비친 따뜻한 흰색 */
  --ivory:   #eee0c8;
  --cream:   #d8c8a8;
  --mist:    #a08060;
  --fog:     #604830;
  --shadow:  #2e1a0e;
  --gold:    #e8841a;          /* 횃불 주황 */
  --gold2:   #a85010;          /* 어두운 불꽃 */
  --sage:    #c87830;          /* 불꽃 황갈 */
  --slate:   #904828;          /* 적갈 */
  --crimson: #cc2020;          /* 선혈 붉은색 */
  --serif:   'Nanum Myeongjo', serif;
  --title:   'Nanum Myeongjo', serif;
  --mono:    'DM Mono', monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);font-family:var(--serif);min-height:100vh;overflow-x:hidden;color:var(--cream);}

/* 고딕 벽돌 그레인 오버레이 */
body::after{
  content:'';
  position:fixed;inset:0;z-index:1;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(180,60,10,0.025) 3px,
      rgba(180,60,10,0.025) 4px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 3px,
      rgba(100,30,5,0.015) 3px,
      rgba(100,30,5,0.015) 4px
    );
  pointer-events:none;
}

#curtain{
  position:fixed;inset:0;z-index:300;
  background:#0d0704;opacity:0;pointer-events:none;
  transition:opacity 0.45s ease;
}
#curtain.show{opacity:1;pointer-events:all;}

/* ══════════════════════
   인트로 비디오 레이어 추가
══════════════════════ */
#intro-video-container {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: #000000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
  transition: opacity 1s ease;
}
#intro-video-container.fade-out {
  opacity: 0;
  pointer-events: none;
}
#intro-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
/* 비디오를 건너뛰거나 재생이 불가능할 경우를 위한 안내 (시각적으로 숨겨져 있으나 조작용) */
.skip-intro-hint {
  position: absolute;
  bottom: 30px;
  right: 30px;
  font-family: var(--mono);
  font-size: 11px;
  color: rgba(255, 255, 255, 0.4);
  letter-spacing: 0.1em;
  cursor: pointer;
  z-index: 501;
  background: rgba(0,0,0,0.5);
  padding: 6px 12px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: all 0.3s;
}
.skip-intro-hint:hover {
  color: var(--ivory);
  border-color: var(--gold);
}

/* ══════════════════════
   타이틀
══════════════════════ */
#title-screen{
  position:fixed;inset:0;z-index:100;
  overflow:hidden;background:var(--bg);
  opacity: 0; /* 인트로 페이드인을 위해 초기 투명도 0 설정 */
}
#title-screen.fade-in {
  opacity: 1;
  transition: opacity 1.5s ease;
}

/* 타이틀 배경: 어두운 창고/폐공장 내부 — 잿빛+파란 빛 */
.title-bg-img{
  position:absolute;inset:0;
  /* 어두운 산업 공간 — 잿빛 */
  background-image:url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1800&q=90&fm=jpg');
  background-size:cover;
  background-position:center 50%;
  filter:brightness(0.18) saturate(0.12) hue-rotate(200deg) contrast(1.2);
  animation:bgDrift 22s ease-in-out infinite alternate;
}
@keyframes bgDrift{
  0%  {background-position:50% 48%;}
  50% {background-position:51% 52%;}
  100%{background-position:50% 50%;}
}

/* 타이틀 배경 레이어2: 횃불 붉은 오버레이 */
.title-bg-overlay{
  position:absolute;inset:0;
  background-image:url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1800&q=85&fm=jpg');
  background-size:cover;
  background-position:center 60%;
  filter:brightness(0.2) saturate(1.2) sepia(1) hue-rotate(330deg) contrast(1.4);
  mix-blend-mode:screen;
  opacity:0.55;
  animation:overlayDrift 28s ease-in-out infinite alternate;
}
@keyframes overlayDrift{
  0%  {opacity:0.34;}
  50% {opacity:0.42;}
  100%{opacity:0.36;}
}

/* 왕자 동상 이미지 레이어 (가운데) — 잿빛 실루엣 */
.title-statue{
  position:absolute;
  bottom:0;left:50%;
  transform:translateX(-50%);
  width:clamp(180px,24vw,340px);
  height:clamp(300px,54vh,580px);
  background-image:url('https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=800&q=90&fm=jpg');
  background-size:cover;
  background-position:center 10%;
  /* 차갑고 잿빛인 실루엣 — 파란 윤곽 */
  filter:brightness(0.30) saturate(0.4) sepia(0.6) hue-rotate(340deg) contrast(1.5);
  mask-image:linear-gradient(to top, #0d0704 0%, transparent 10%, transparent 80%, rgba(13,7,4,0.4) 100%);
  -webkit-mask-image:linear-gradient(to top, #0d0704 0%, transparent 10%, transparent 80%, rgba(13,7,4,0.4) 100%);
  animation:statueFloat 7s ease-in-out infinite;
}
@keyframes statueFloat{
  0%,100%{transform:translateX(-50%) translateY(0px);}
  50%{transform:translateX(-50%) translateY(-7px);}
}

/* 그라데이션 오버레이들 */
.title-vignette{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 25%, rgba(4,4,10,0.65) 100%),
    linear-gradient(to bottom, rgba(4,4,10,0.6) 0%, transparent 25%, transparent 55%, rgba(4,4,10,0.98) 90%);
}

/* 횃불 후광 (동상 위) */
.title-glow{
  position:absolute;
  bottom:clamp(160px,28vh,300px);
  left:50%;transform:translateX(-50%);
  width:clamp(120px,22vw,260px);
  height:clamp(80px,14vw,160px);
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(232,132,26,0.22) 0%, rgba(180,60,10,0.10) 50%, transparent 75%);
  animation:glowPulse 3s ease infinite;
}
@keyframes glowPulse{
  0%,100%{opacity:1;transform:translateX(-50%) scale(1);}
  50%{opacity:0.45;transform:translateX(-50%) scale(1.2);}
}

.title-content{
  position:absolute;inset:0;z-index:5;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0 24px 20px;
  text-align:center;
}

/* 순차 등장 애니메이션 (title-screen에 fade-in 클래스가 붙은 이후 전개) */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(22px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes lineGrow{
  from{height:0;opacity:0;}
  to{height:44px;opacity:1;}
}

#title-screen.fade-in .t-eye{
  font-family:var(--mono);font-size:9px;
  letter-spacing:0.44em;color:var(--fog);
  margin-bottom:14px;text-transform:uppercase;
  opacity:0;
  animation:fadeIn 1s ease 0.4s forwards;
}

#title-screen.fade-in .t-main{
  font-family:var(--title);
  font-size:clamp(44px,9.5vw,82px);
  font-weight:700;line-height:0.95;
  color:var(--ivory);letter-spacing:0.1em;
  text-shadow:0 2px 40px rgba(232,132,26,0.2), 0 0 80px rgba(0,0,0,0.9);
  margin-bottom:10px;
  opacity:0;
  animation:fadeUp 1.2s ease 0.8s forwards;
}

#title-screen.fade-in .t-kr{
  font-family:var(--serif);
  font-size:clamp(12px,2.2vw,17px);
  color:var(--fog);letter-spacing:0.28em;
  margin-bottom:36px;
  opacity:0;
  animation:fadeIn 1s ease 1.6s forwards;
}

#title-screen.fade-in .t-line{
  width:1px;height:0;
  background:linear-gradient(to bottom,var(--gold2),transparent);
  margin:0 auto 24px;
  opacity:0;
  animation:lineGrow 0.8s ease 2.2s forwards;
}

#title-screen.fade-in .t-desc{
  font-size:13px;font-weight:400;
  color:var(--mist);line-height:2.05;
  max-width:310px;margin-bottom:52px;
  opacity:0;
  animation:fadeUp 1s ease 2.6s forwards;
}

#title-screen.fade-in .start-btn{
  all:unset;cursor:pointer;
  font-family:var(--mono);font-size:10px;
  letter-spacing:0.34em;text-transform:uppercase;
  color:var(--bg);background:var(--ivory);
  padding:15px 50px;
  transition:all 0.38s;
  opacity:0;
  animation:fadeUp 1s ease 3.2s forwards;
}
#title-screen.fade-in .start-btn:hover{background:#f8f4ec;letter-spacing:0.48em;}

/* ══════════════════════
   HUD
══════════════════════ */
#game{display:none;}
#hud{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:10px 36px 8px;
  display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;
  background:linear-gradient(to bottom,rgba(13,7,4,0.97) 55%,transparent);
  border-bottom:1px solid rgba(28,28,40,0.9);
}
.hud-logo{
  font-family:var(--serif);font-size:13px;
  letter-spacing:0.12em;color:var(--cream);
  margin-right:auto;opacity:0.85;
}
.stat{display:flex;flex-direction:column;gap:5px;min-width:80px;}
.stat-lbl{font-family:var(--mono);font-size:11px;letter-spacing:0.22em;color:var(--fog);}
.bw{height:3px;background:var(--border);overflow:hidden;}
.bar{height:100%;transition:width 0.85s cubic-bezier(0.4,0,0.2,1);}
.bar.i{background:#c07030;}
.bar.s{background:#7a8898;}
.bar.n{background:#a84040;}
.stat-num{font-family:var(--mono);font-size:17px;color:var(--cream);}
.flags{display:flex;gap:7px;padding-bottom:1px;}
.flag{font-family:var(--mono);font-size:11px;padding:3px 9px;border:1px solid rgba(150,130,100,0.4);color:rgba(150,130,100,0.7);letter-spacing:0.1em;transition:all 0.4s;}
.flag.on{border-color:var(--gold);color:var(--gold);background:rgba(232,132,26,0.1);}

/* ══════════════════════════════════════
   씬 레이아웃 — 화면 꽉 채우기
══════════════════════════════════════ */
#scene-wrap{
  position:fixed;
  top:56px;left:0;right:0;bottom:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── 이미지 패널 ── */
.s-img{
  width:100%;
  max-width:900px;
  margin:0 auto;
  height:38%;
  flex:0 0 38%;
  position:relative;
  overflow:hidden;
  display:block;
  border:1px solid rgba(232,132,26,0.12);
}
.s-img svg{
  position:absolute;inset:0;
  width:100%;height:100%;display:block;
}
.s-img::before{
  content:'장면';
  position:absolute;top:12px;left:14px;z-index:10;
  font-family:'Nanum Myeongjo',serif;
  font-size:9px;letter-spacing:0.18em;
  color:rgba(232,132,26,0.55);
  border:1px solid rgba(232,132,26,0.2);
  padding:2px 8px;pointer-events:none;
}
.s-img::after{
  content:'';position:absolute;
  bottom:0;left:0;right:0;height:40%;
  background:linear-gradient(to bottom,transparent,var(--bg));
  pointer-events:none;z-index:2;
}
.s-img .scene-badge{
  position:absolute;top:12px;right:14px;z-index:10;
  font-family:var(--serif);font-size:13px;letter-spacing:0.08em;
  color:rgba(232,132,26,0.85);pointer-events:none;
  font-weight:700;
  text-shadow:0 2px 8px rgba(0,0,0,0.9);
}
.s-img .scene-overlay{
  position:absolute;bottom:0;left:0;right:0;z-index:5;
  padding:30px 20px 14px;
  display:flex;flex-direction:column;gap:3px;
  background:linear-gradient(to bottom,transparent,rgba(10,3,1,0.95));
  pointer-events:none;
}
.s-img .scene-overlay .ov-eye{
  display:none;
}
.s-img .scene-overlay .ov-title{
  display:none;
}
.s-img .tint{position:absolute;inset:0;mix-blend-mode:multiply;}

.s-body{
  flex:1;
  min-height:0;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:16px 60px 12px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* 씬 헤더 */
.s-eye{font-family:var(--mono);font-size:11px;letter-spacing:0.3em;color:var(--fog);margin-bottom:4px;text-transform:uppercase;}
.s-title{font-family:var(--serif);font-size:clamp(26px,3.8vw,36px);font-weight:700;line-height:1.05;color:var(--ivory);margin-bottom:4px;}
.s-title em{font-style:italic;color:var(--gold);}
.s-place{font-family:var(--mono);font-size:11px;color:var(--fog);letter-spacing:0.1em;line-height:1.5;}
.cond{
  margin-top:5px;padding:5px 12px;margin-bottom:6px;
  border-left:2px solid var(--gold2);
  background:rgba(232,132,26,0.06);
  font-family:var(--mono);font-size:11px;
  color:var(--gold);letter-spacing:0.06em;line-height:1.75;
}

/* 서사 */
.narr{padding:10px 0 8px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);margin-top:10px;flex:1;min-height:0;overflow:hidden;}
.sd{font-family:var(--mono);font-size:11px;color:var(--fog);letter-spacing:0.07em;line-height:1.72;border-left:1px solid var(--border);padding-left:14px;}
.dlg{display:flex;flex-direction:column;gap:6px;}
.spk{font-family:var(--mono);font-size:11px;letter-spacing:0.3em;text-transform:uppercase;}
.spk.pr{color:var(--gold);}
.spk.sw{color:var(--sage);}
.spk.mg{color:var(--slate);}
.spk.pz{color:var(--crimson);}
.spk.fy{color:#c090e0;}
.line{
  font-family:var(--serif);
  font-size:clamp(15px,1.6vw,18px);
  font-weight:400;line-height:1.82;
  color:var(--white);letter-spacing:0.01em;
}
.rule{
  height:1px;flex-shrink:0;
  background:linear-gradient(to right,transparent,var(--border) 20%,var(--border) 80%,transparent);
  margin:10px 0;
}

/* 선택지 */
.choices{padding:12px 0 8px;display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;flex-shrink:0;}
.c-head{
  font-family:var(--mono);font-size:8px;
  letter-spacing:0.24em;color:var(--fog);
  text-transform:uppercase;margin-bottom:3px;
}
.cbtn{
  all:unset;cursor:pointer;
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;
  flex:1;min-width:180px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.01);
  position:relative;overflow:hidden;
  transition:transform 0.18s ease,border-color 0.18s,background 0.18s;
}
.cbtn::before{
  content:'';position:absolute;left:0;top:0;right:0;height:2px;
  background:var(--gold);opacity:0;transition:opacity 0.18s;
}
.cbtn:hover{transform:translateY(-3px);border-color:rgba(232,132,26,0.4);background:rgba(232,132,26,0.05);}
.cbtn:hover::before{opacity:1;}
.cbtn:hover .ck{color:var(--gold);}
.cbtn.bad::before{background:var(--crimson);}
.cbtn.bad:hover{border-color:rgba(204,32,32,0.4);background:rgba(204,32,32,0.06);}
.cbtn.bad:hover .ck{color:var(--crimson);}
.ck{font-family:var(--mono);font-size:13px;color:var(--mist);min-width:26px;flex-shrink:0;transition:color 0.18s;}
.cc{display:flex;flex-direction:column;gap:2px;}
.cm{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ivory);line-height:1.3;}
.cd{font-family:var(--serif);font-size:13px;color:var(--mist);line-height:1.4;}
.ce{font-family:var(--mono);font-size:11px;color:var(--sage);letter-spacing:0.06em;}
.cbtn.bad .ce{color:var(--crimson);}
.warn-b{
  flex-shrink:0;padding:5px 10px;
  border-left:2px solid var(--crimson);
  background:rgba(204,32,32,0.07);
  font-family:var(--mono);font-size:9px;
  color:var(--crimson);letter-spacing:0.05em;line-height:1.5;
  margin-bottom:4px;animation:wp 2.5s ease infinite;
}
@keyframes wp{0%,100%{opacity:1}50%{opacity:0.45}}

/* 엔딩 */
.end-wrap{
  flex:1;min-height:0;overflow:hidden;
  padding:14px 0 8px;
  display:flex;flex-direction:column;gap:10px;
  animation:eIn 1.2s ease forwards;
}
@keyframes eIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.end-tag{font-family:var(--mono);font-size:8px;letter-spacing:0.26em;color:var(--fog);text-transform:uppercase;flex-shrink:0;}
.end-title{font-family:var(--serif);font-size:clamp(20px,3vw,34px);font-weight:700;line-height:1.05;flex-shrink:0;}
.end-title.bad  {color:var(--crimson);}
.end-title.rev  {color:var(--gold);}
.end-title.integ{color:var(--sage);}
.end-text{
  font-family:var(--serif);font-size:clamp(12px,1.4vw,15px);
  font-weight:400;line-height:1.75;color:var(--cream);
  border-left:2px solid var(--border);padding-left:14px;flex-shrink:0;
}
.end-stats{
  display:flex;gap:24px;flex-shrink:0;
  padding:10px 0;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.es{display:flex;flex-direction:column;gap:5px;}
.esl{font-family:var(--mono);font-size:8px;letter-spacing:0.22em;color:var(--fog);}
.esv{font-family:var(--mono);font-size:18px;}
.restart-btn{
  all:unset;cursor:pointer;flex-shrink:0;
  font-family:var(--mono);font-size:9px;
  letter-spacing:0.2em;color:var(--fog);
  border:1px solid var(--border);
  padding:8px 20px;text-transform:uppercase;
  transition:all 0.24s;align-self:flex-start;
}
.restart-btn:hover{color:var(--ivory);border-color:var(--mist);}
.scene-in{animation:sIn 0.7s ease forwards;}
@keyframes sIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="curtain"></div>

<div id="intro-video-container">
  <video id="intro-video" src="video/Prince_overlooks_digital_city_202606211615.mp4" playsinline muted></video>
  <div class="skip-intro-hint" onclick="revealTitleScreen()">SKIP INTRO ↩</div>
</div>

<div id="title-screen">
  <div class="title-bg-img"></div>
  <div class="title-bg-overlay"></div>
  <div class="title-statue"></div>
  <div class="title-glow"></div>
  <div class="title-vignette"></div>

  <div class="title-content">
    <p class="t-eye">Oscar Wilde · Interactive Fiction · Mystery</p>
    <h1 class="t-main">THE HAPPY<br>PRINCE</h1>
    <p class="t-kr">행복한 왕자 — 사라지는 도시</p>
    <div class="t-line"></div>
    <p class="t-desc">
      움직일 수 없는 왕자가 녹슨 심장으로<br>
      도시를 살리거나 파괴하는<br>
      15분의 비극.
    </p>
    <button class="start-btn" onclick="startGame()">시작하다 →</button>
  </div>
</div>

<div id="game">
  <div id="hud">
    <span class="hud-logo">행복한 왕자 — 사라지는 도시</span>
    <div class="stat">
      <span class="stat-lbl">INTEGRITY</span>
      <div class="bw"><div class="bar i" id="bar-i" style="width:0%"></div></div>

/* ─────────────────────────────────────────
   시네마틱 인트로 & 타이틀 스크립트 결합
   ───────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
  const video = document.getElementById('intro-video');
  
  // 브라우저 자동재생 정책 대응을 위해 비디오 플레이 시도
  const playPromise = video.play();
  if (playPromise !== undefined) {
    playPromise.catch(error => {
      console.log("자동재생이 차단되어 사용자의 상호작용 또는 스킵을 기다립니다.");
    });
  }

  // 비디오가 종료되었을 때의 영화적 전환 연출 이벤트 등록
  video.addEventListener('ended', () => {
    // 1초 동안 부드럽게 블랙 아웃 페이드 아웃 진행
    const container = document.getElementById('intro-video-container');
    container.classList.add('fade-out');
    
    setTimeout(() => {
      container.style.display = 'none';
      // 1초 암전 후 기존 타이틀 스크린을 스무스하게 페이드인 노출
      const titleScreen = document.getElementById('title-screen');
      titleScreen.classList.add('fade-in');
    }, 1000);
  });
});

// 인트로 비디오 스킵 함수 정의
function revealTitleScreen() {
  const video = document.getElementById('intro-video');
  video.pause();
  const container = document.getElementById('intro-video-container');
  container.classList.add('fade-out');
  setTimeout(() => {
    container.style.display = 'none';
    const titleScreen = document.getElementById('title-screen');
    titleScreen.classList.add('fade-in');
  }, 1000);
}

    btn('A','신호 동조','도시의 고통에 주파수를 맞추고 데이터 그리드를 개방한다','Sync +10 · Noise +5',"cs1('A')")+
    btn('B','시스템 고립','방화벽을 세워 외부 변조를 차단하고 관조한다','Integrity +10',"cs1('B')");
  render(scene('s1','Scene 01 / 기(起) — 각성','탑 위의 왕자','네트워크 관측 탑 · 외곽 고딕 구역','',narr,options));
}
function cs1(c){
  if(c==='A'){ch('s',10);ch('n',5);G.s2a=true;}
  else if(c==='B'){ch('i',10);}
  go(sceneS2);
}

function sceneS2(){
  let sub='', warn='', ch_='';
  let narr = `<div class="sd">좁고 습한 하부 통로. 벽면에 미세한 균열이 가며 정체불명의 바이너리 노이즈 신호가 흘러나온다. 부랑자들과 부서진 기계들이 방치되어 있다.</div>`;

  if(G.s2a){
    sub='[신호 동조] 활성화 상태';
    narr += `
      <div class="sd" style="color:var(--sage);">개방된 주파수를 통해 하부 구역의 구조 요청이 직접 필터링된다. PZ 군경의 추적 신호가 가까워진다.</div>
      <div class="dlg"><span class="spk sw">제비 (부랑자 네트워크 리더)</span><span class="line">"왕자님, 소문이 진짜였군. 상부의 통제 필터를 해제해 주십시오. 우리에겐 연산 자원이 필요합니다."</span></div>
    `;
    ch_ =
      btn('A','연산 자원 방출','황금 외피의 전력 인프라를 하부망에 직결한다','Integrity −10 · Sync +10 · Noise +10',"cs2('A')")+
      btn('B','요청 기각','리스크가 너무 크다. 연결을 차단하고 신호를 침묵시킨다','Noise −5',"cs2('B')");
  } else {
    sub='[시스템 고립] 유지 상태';
    narr += `
      <div class="sd">폐쇄형 서버 구조 덕분에 외부 추적은 없으나, 하부 구역의 부패율은 더욱 빠르게 상승한다.</div>
      <div class="dlg"><span class="spk mg">군경 정찰대</span><span class="line">"구역 내 비인가 신호 감지 불능. 청소 프로세스를 계속 진행하라."</span></div>
    `;
    ch_ =
      btn('C','강제 개입','뒤늦게나마 방화벽을 뚫고 하부의 데이터를 구출하려 시도한다','Sync +5 · Noise +10',"cs2('C')")+
      btn('D','방관','그들이 무너지는 것은 이 거대한 연산 시스템의 예정된 수명이다','Integrity +10 · Sync −5',"cs2('D')");
  }
  render(scene('s2','Scene 02 / 승(承) — 전개','사라지는 거리','하부 슬럼 구역 4번 통로',sub,narr,ch_));
}
function cs2(c){
  if(c==='A'){ch('i',-10);ch('s',10);ch('n',10);G.s3a=true;}
  else if(c==='B'){ch('n',-5);}
  else if(c==='C'){ch('s',5);ch('n',10);}
  else if(c==='D'){ch('i',10);ch('s',-5);}
  go(sceneS3);
}

function sceneS3(){
  let sub='', warn='', ch_='';
  let narr = `<div class="sd">도시의 중심, 금빛 광장. 상층 권력자들이 자원 분배 저울 홀로그램 주위에 모여 있다. 중앙 시스템의 불균형이 극에 달했다.</div>`;

  if(G.s3a){
    sub='[하부망 결합] 성공';
    narr += `
      <div class="sd" style="color:var(--gold);">광장의 저울 인터페이스가 하부 구역의 트래픽 과부하로 격렬하게 진동한다.</div>
      <div class="dlg"><span class="spk pr">왕자</span><span class="line">"내 눈에 박힌 사파이어 렌즈... 이것이 있으면 저 저울의 위조된 균형을 바로잡을 행정 제어 코드를 읽을 수 있다."</span></div>
    `;
    ch_ =
      btn('A','사파이어 추출','시각 센서를 뽑아 제어권을 하부 저항망에 넘긴다','Integrity −10 · Sync +15 · KEY 획득',"cs3('A')")+
      btn('B','인터페이스 과부하 방치','물리적 희생 없이 시스템이 스스로 한계에 도달해 터지기를 기다린다','Noise +15',"cs3('B')");
  } else {
    sub='[통제 하에 있는 광장]';
    narr += `
      <div class="sd">저울은 여전히 상층부 위주로 완벽하게 자원을 왜곡 분배하고 있다. 시스템 안정성은 높으나 내부는 썩어가고 있다.</div>
    `;
    ch_ =
      btn('C','데이터 위조 우회','관리자 권한 없이 잔여 트래픽을 가공해 아주 미미한 자원만 변조한다','Sync +5 · Noise +5',"cs3('C')")+
      btn('D','체제 순응','시스템의 대의를 위해 이 불평등한 평화를 보존한다','Integrity +15 · Sync −10',"cs3('D')");
  }
  render(scene('s3','Scene 03 / 결(結) — 위기','금빛 광장','중앙 행정 광장 / 연산 저울 제어소',sub,narr,ch_));
}
function cs3(c){
  if(c==='A'){ch('i',-10);ch('s',15);G.key=true;}
  else if(c==='B'){ch('n',15);}
  else if(c==='C'){ch('s',5);ch('n',5);}
  else if(c==='D'){ch('i',15);ch('s',-10);}
  
  if(G.n>=25)go(sceneS4);else go(sceneS5);
}

function sceneS4(){
  let sub=`[노이즈 임계치 돌파: ${G.n}] 강제 진입`, warn='⚠️ SYSTEM FAILURE RISK DETECTED', ch_='';
  let narr = `
    <div class="sd">경고음이 울리는 지하 제어소. 붉은 냉각수가 흐르는 배관들 사이로 PZ 메인프레임이 가동 중이다. 시스템 과열로 인해 곧 전 구역 포맷이 시작되려 한다.</div>
    <div class="dlg"><span class="spk pz">PZ 중앙 AI</span><span class="line">"시스템 노이즈 오염도 심각. 전체 청소 및 리부트 프로세스 권장. 동상의 무단 간섭을 차단하십시오."</span></div>
  `;
  ch_ =
    btn('A','코어 리셋 수용','도시 전체를 포맷하는 청소 처리에 동의한다','Noise −20 · Integrity +5 · 강제 전(轉) 이동',"cs4('reset')")+
    btn('B','방전 오버로드','남은 모든 에너지 박막을 불태워 방화벽을 역으로 깨부순다','Sync +15 · Noise +10 · 강제 전(轉) 이동',"cs4('overload')",true);
  render(scene('s4','Scene 04 / 전(轉) — 절정 임계','지하 핵심부','메인프레임 배관 냉각실',sub,warn,narr,ch_));
}
function cs4(c){
  if(c==='reset'){ch('n',-20);ch('i',5);}
  else if(c==='overload'){ch('s',15);ch('n',10);}
  go(sceneS5);
}

function sceneS5(){
  let sub=`Integrity ${G.i} · Sync ${G.s} · Noise ${G.n}`, warn='', ch_='';
  let narr = `
    <div class="sd">최종 제어실의 홀로그램 스크린 앞에 선다. 납 심장의 격막이 열리고 마지막 연산 에너지가 요동친다.</div>
    <div class="sd">도시를 원래의 엄격한 기하학적 정적으로 되돌릴 것인가, 아니면 통제할 수 없는 불꽃의 해방으로 밀어붙일 것인가. 코어 엔지니어가 당신의 손길을 기다린다.</div>
  `;
  ch_ =
    btn('W','질서 재배선','모든 권한을 회수하여 고립된 청정한 시스템을 재구축한다','Sync ≥ 30 요구',G.key?"cs5('win')":"alert('사파이어 렌즈[KEY]가 없어 제어 코드를 읽을 수 없습니다!')")+
    btn('G','도박','모든 것을 걸고 50% 확률에 도전한다','Sync −10 · 50% 성공/실패',"cs5('gamble')",true)+
    btn('↩B','S4 재시작','관리자 접근으로 돌아간다','',\"cs5('b4')\")+
    btn('↩C','S3 재시작','금빛 광장으로 돌아간다','',\"cs5('b3')\");
  render(scene('s5','Scene 05 / 전(轉) — 절정','<em>최종 코어</em> — 선녀 vs PZ',`빛나는 저울 홀로그램 · ${sub}`,'',narr,warn+ch_));
}
function cs5(c){
  if(c==='win'){const t=G.key?30:38;(G.i>=t||G.s>=t)?go(sceneS6):go(badEnd);}\n  else if(c==='gamble'){ch('s',-10);Math.random()<0.5?go(sceneS6):go(badEnd);}\n  else if(c==='b4')go(sceneS4);\n  else if(c==='b3')go(sceneS3);\n}

function sceneS6(){
  if(G.s>=45)go(endA);
  else if(G.s>=30 && G.i>=30)go(endB);
  else go(badEnd);
}

function endA(){
  render(ending('endA',
    'End_A / Sync ≥ 45 / Clear','rev','혁명가형',
    '왕자의 해방 : 무한한 디지털 새벽',
    '동상의 모든 황금과 사파이어, 그리고 납 심장의 마지막 코어 자원까지 하부망에 완벽하게 결합되었다. 완고하고 거대했던 관리자 PZ의 성벽은 무너져 내리고, 도시는 통제되지 않는 무한한 자유 주파수의 바다로 나아간다. 움직일 수 없었던 왕자는 마침내 파괴된 탑의 잔해 속에서 영원한 안식을 맞이하며, 새롭게 피어난 새벽의 광장은 그가 남긴 데이터의 유산으로 가득 차오른다.'));
}

function endB(){
  render(ending('endB',
    'End_B / Balance Clear','integ','설계자형',
    '왕자의 유산 : 냉혹한 기하학적 통제',
    '불필요한 노이즈와 과부하 트래픽은 완벽하게 제거되었다. 사파이어 제어 코드로 시스템을 완벽하게 장악한 왕자는 스스로가 이 도시의 영원한 관리 메인프레임이 되기로 결심한다. 하부망의 폭동은 진압되었고, 상층부의 자원 왜곡 역시 철저한 연산 비율에 의해 재조정되었다. 완벽한 균형, 그러나 더 이상의 감정도 변수도 허용되지 않는 영원히 얼어붙은 차가운 기하학적 평화가 도시를 지배한다.'));
}

function badEnd(){
  render(ending('bad',
    'Bad_End / Failure','bad','망령형',
    '침묵하는 도시 : 납 심장의 파열',
    '연산의 주파수는 갈 길을 잃었고, 과부하된 노이즈 스트림은 코어를 파열시켰다. 관리자 PZ는 모든 구역을 비가역적 포맷 상태로 동결시켰고, 하부 구역은 영원한 암흑 속으로 침몰했다. 꼭대기에 선 왕자의 동상은 형체를 알아볼 수 없을 정도로 일그러진 채 차가운 고철 잔해로 변해버렸고, 오직 적막만이 흐르는 거리에 깨어진 납 심장의 붉은 에러 신호만이 쓸쓸히 점멸할 뿐이다.'));
}
</script>
