<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>행복한 왕자: 사라지는 도시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #050302;
      --card-bg: #120906;
      --card-inner: #1a0f0a;
      --border: #2b170e;
      --text-main: #ebdcd5;
      --text-sub: #9e8a80;
      --accent: #e64a19;
      --font: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
    body { background: var(--bg); color: var(--text-main); padding-bottom: 60px; overflow-x: hidden; line-height: 1.6; letter-spacing: -0.4px; }

    /* 👁️ 오프닝 타이틀 (미스터리 연출) */
    #opening-title-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1c0d06 0%, #050302 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .title-logo-box { margin-bottom: 50px; animation: glitchGlow 4s infinite alternate; }
    .title-logo-box h1 { font-size: 36px; font-weight: 900; color: var(--text-main); letter-spacing: -1.5px; line-height: 1.3; }
    .title-logo-box h1 span { color: var(--accent); text-shadow: 0 0 20px rgba(230,74,25,0.4); }
    .title-logo-box p { font-size: 11px; color: var(--text-sub); margin-top: 14px; font-weight: 400; letter-spacing: 5px; opacity: 0.7; }
    
    .start-game-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 18px 44px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.4s ease;
    }
    .start-game-btn:hover { border-color: var(--accent); color: var(--text-main); box-shadow: 0 0 15px rgba(230,74,25,0.1); }
    .start-game-btn:active { transform: scale(0.99); }

    @keyframes glitchGlow {
      0% { opacity: 0.85; transform: scale(0.99); }
      50% { opacity: 1; }
      100% { opacity: 0.9; transform: scale(1.01); filter: hue-rotate(5deg); }
    }

    /* 상단 은밀한 데이터 계기판 */
    header { background: #0c0604; padding: 16px; border-bottom: 1px solid var(--border); text-align: center; }
    header h1 { font-size: 15px; font-weight: 700; color: var(--text-sub); letter-spacing: 1px; }

    .status-panel { max-width: 650px; margin: 20px auto 0 auto; padding: 14px 18px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; display: flex; justify-content: space-around; align-items: center; text-align: center; opacity: 0.8; }
    .stat-box { flex: 1; }
    .stat-label { font-size: 10px; color: var(--text-sub); font-weight: 500; letter-spacing: 0.5px; }
    .stat-val { font-size: 15px; font-weight: 700; color: var(--text-main); margin-top: 4px; font-family: monospace; }
    .stat-critical { color: var(--accent) !important; text-shadow: 0 0 8px rgba(230,74,25,0.5); }

    main { max-width: 650px; margin: 20px auto; padding: 0 16px; }

    /* 카드 프레임 */
    .game-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 16px 44px rgba(0,0,0,0.7); }
    
    .screen-area { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
    .screen-area video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7) contrast(1.1); }
    .stage-badge { position: absolute; top: 14px; left: 14px; background: rgba(5,3,2,0.85); padding: 5px 12px; font-size: 10px; font-weight: 600; color: var(--text-sub); border: 1px solid var(--border); letter-spacing: 1px; }
    .screen-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, rgba(18,9,6,0.98)); pointer-events: none; }

    .content-area { padding: 30px 24px 24px 24px; display: flex; flex-direction: column; gap: 24px; background: linear-gradient(to bottom, rgba(18,9,6,0) 0%, #120906 100%); }
    .stage-title { font-size: 18px; font-weight: 700; color: var(--text-main); border-left: 3px solid var(--accent); padding-left: 12px; }
    
    /* 서사 텍스트 상자 */
    .story-text { font-size: 14.5px; color: var(--text-sub); line-height: 1.8; text-align: justify; background: rgba(26, 15, 10, 0.5); padding: 22px 20px; border-radius: 6px; border: 1px solid rgba(43, 23, 14, 0.3); }

    /* 🚨 [신규] 게임 화면 내 알림 텍스트 서식 */
    .system-alert-text { color: var(--accent); font-weight: 700; margin-bottom: 12px; border-bottom: 1px dashed rgba(230,74,25,0.4); padding-bottom: 10px; font-family: monospace; letter-spacing: 0.5px; }

    /* 선택지 버튼 */
    .choice-area { display: flex; flex-direction: column; gap: 14px; }
    .choice-btn { background: var(--card-inner); border: 1px solid var(--border); color: var(--text-sub); padding: 18px 22px; border-radius: 4px; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; line-height: 1.5; transition: all 0.3s; }
    .choice-btn:hover { border-color: var(--accent); color: var(--text-main); background: #21120b; box-shadow: inset 0 0 10px rgba(230,74,25,0.05); }
    .choice-btn:active { transform: scale(0.99); }

    /* 결말 서식 */
    .hidden { display: none !important; }
    .ending-box { background: #0c0604; border: 1px solid var(--border); padding: 40px 24px; text-align: center; border-radius: 8px; margin-top: 20px; }
    .ending-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 20px; letter-spacing: -0.5px; }
    .reset-btn { background: transparent; border: 1px solid var(--border); color: var(--text-sub); padding: 14px 36px; border-radius: 4px; font-weight: 600; font-size: 13px; margin-top: 30px; cursor: pointer; transition: all 0.3s; }
    .reset-btn:hover { border-color: var(--accent); color: var(--text-main); }
  </style>
</head>
<body>

  <div id="opening-title-screen">
    <div class="title-logo-box">
      <h1>행복한 왕자<br><span>사라지는 도시</span></h1>
      <p>MEMORIES IN THE RUSTED CODE</p>
    </div>
    <button class="start-game-btn" onclick="startGame()">동조 수신기 가동</button>
  </div>

  <header>
    행복한 왕자 : 사라지는 도시
  </header>

  <div class="status-panel">
    <div class="stat-box">
      <div class="stat-label">심장 동조 (Sync)</div>
      <div id="stat-sync" class="stat-val">00</div>
    </div>
    <div class="stat-box" style="border-left: 1px solid var(--border); border-right: 1px solid var(--border);">
      <div class="stat-label">잔존 가치 (Echo)</div>
      <div id="stat-integrity" class="stat-val">00</div>
    </div>
    <div class="stat-box" style="border-right: 1px solid var(--border);">
      <div class="stat-label">침식 오염 (Erosion)</div>
      <div id="stat-noise" class="stat-val">00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">해독 코드 (Core)</div>
      <div id="stat-key" class="stat-val">LOCKED</div>
    </div>
  </div>

  <main>
    <div class="game-container hidden" id="game-card">
      <div class="screen-area">
        <video id="game-video" src="" autoplay muted loop playsinline></video>
        <div class="stage-badge" id="game-badge">LOG</div>
        <div class="screen-overlay"></div>
      </div>
      <div class="content-area">
        <div class="stage-title" id="game-title">수신 대기 중...</div>
        
        <div class="story-text">
          <div id="game-alert-box" class="system-alert-text hidden"></div>
          <div id="game-story">도시 주파수를 스캔하고 있습니다.</div>
        </div>

        <div class="choice-area" id="game-choices">
          </div>
      </div>
    </div>

    <div class="ending-box hidden" id="ending-screen">
      <div class="ending-title" id="end-title">최종 관측 보고서</div>
      <div class="story-text" id="end-desc">기록 소멸.</div>
      <button class="reset-btn" onclick="resetGame()">루프 재접속</button>
    </div>
  </main>

  <script>
    let state = { sync: 0, integrity: 0, noise: 0, hasKey: false, currentStage: "S1" };

    const STAGES = {
      S1: {
        title: "서막 — 탑 위의 방관자",
        badge: "SIGNAL . S1",
        video: "./Prince_overlooks_digital_city_202606211615.mp4",
        story: "짙은 안개와 잿빛 회로로 뒤덮인 도시. 가장 높은 탑 위에 박제된 채 격리되어 있던 왕자는 심장부 깊은 곳에서 깜빡이는 기괴한 박동을 느낍니다. 도시 밑바닥에서 정체모를 신음과 부서진 신호들이 뿜어져 나오기 시작합니다. 손에 쥔 녹슨 코어가 붉게 명멸하는 순간, 더 이상 관조할 수 없음을 깨닫습니다. 기로가 열립니다.",
        choices: [
          { text: "금기를 깨고 도시의 주파수에 직접 영혼을 동조시킨다.", action: () => { state.sync += 20; state.noise += 5; nextStage("S2"); } },
          { text: "위험을 피해 한 발 물러서서 무너져가는 징후를 관찰하고 기록한다.", action: () => { state.integrity += 20; nextStage("S2"); } }
        ]
      },
      S2: {
        title: "전개 — 골목의 눈동자들",
        badge: "SIGNAL . S2",
        video: "./금빛광장.mp4", 
        story: "탑 아래 도시는 기묘할 정도로 차갑습니다. 어두운 미로 같은 골목길 사이로, 정체 모를 관리자들의 압박 신호가 벽면 홀로그램을 타고 흘러내립니다. 그때, 쇳소리를 내며 다가온 '금빛 제비 드론'이 의도를 알 수 없는 미소를 지으며 차가운 연대를 제안해 옵니다. 함정일지도 모르는 제안 앞에서 왕자는 움직여야 합니다.",
        choices: [
          { text: "드론의 연산 회로와 나의 심장을 깊숙이 연결해 위험 속으로 도약한다.", action: () => { state.sync += 15; state.noise += 5; nextStage("S3"); } },
          { text: "거리를 두며 드론이 흘리는 데이터 조각들을 조용히 분석한다.", action: () => { state.integrity += 15; nextStage("S3"); } }
        ]
      },
      S3: {
        title: "전개 — 거부된 통로",
        badge: "SIGNAL . S3",
        video: "./금빛광장.mp4",
        story: "광장 입구에 발을 디디자, 어둠 속에서 거대한 PZ 시스템의 붉은 레이저 격자가 거미줄처럼 펼쳐지며 공간을 반막합니다. 이 장벽을 넘지 못하면 도시는 이대로 흔적도 없이 증발할 것입니다. 등 뒤의 제비 드론이 위험한 신호를 보냅니다. 같이 뚫을 것인가, 아니면 다른 길을 찾을 것인가.",
        choices: [
          { text: "제비 드론의 출력을 빌려 격자망의 취약점을 정면으로 교란한다.", action: () => { state.sync += 10; nextStage("S4"); } },
          { text: "경보가 울릴 리스크를 감수하고, 홀로 레이저 사이의 차가운 틈새를 돌파한다.", action: () => { state.integrity += 10; state.noise += 10; nextStage("S4"); } }
        ]
      },
      S4: {
        title: "위기 — 감시자의 심장부",
        badge: "SIGNAL . S4",
        video: "./왕자vs관리자.mp4",
        story: "차가운 금속 기둥과 알 수 없는 기호가 적힌 홀로그램 벽. 마침내 마주한 이 세계의 '최종 관리자'는 감정 없는 눈으로 왕자를 내려다봅니다. 다음 방의 문을 열기 위한 '해독 코드'가 필요합니다. 거래를 할 것인가, 속일 것인가, 혹은 그의 논리를 깨부술 것인가.",
        choices: [
          { text: "관리자의 서버 심장부에 내 동조율을 강제로 밀어 넣어 해킹을 시도한다.", action: () => {
              if(state.sync >= 30) { 
                state.hasKey = true; 
                showResultInGame("[SYSTEM SUCCESS : 해독 성공]\n방어벽이 일시적으로 다운되며 해독 코드를 복제했습니다.", "S5");
              } else { 
                state.noise += 10; 
                showResultInGame("[SYSTEM FAILURE : 해킹 실패]\n차가운 역해킹 신호가 역류하며 감시 시스템이 연산 오류를 일으킵니다.", "S5");
              }
            } 
          },
          { text: "소멸해 가는 문명의 마지막 가치 데이터를 전송하며 시스템을 설득한다.", action: () => {
              if(state.integrity >= 30) { 
                state.hasKey = true; 
                showResultInGame("[SYSTEM SUCCESS : 연산 모순 발생]\n관리자의 연산 장치가 일시적 윤리 모순에 빠지며 해독 코드를 방출합니다.", "S5");
              } else { 
                state.noise += 10; 
                showResultInGame("[SYSTEM FAILURE : 논리 거부]\n가치 증명 실패. 관리망의 경비가 더욱 삼엄해집니다.", "S5");
              }
            }
          },
          { text: "코어 오염을 감수하고, 부정한 데이터 우회 통로를 매수한다.", action: () => {
              state.noise += 15; 
              state.hasKey = true; 
              showResultInGame("[SYSTEM WARNING : 비인가 코드 로드]\n어두운 우회 경로를 통해 이질적인 형태의 해독 코드를 연동했습니다.", "S5");
            }
          }
        ]
      },
      S5: {
        title: "절정 — 침묵하는 심판의 저울",
        badge: "SIGNAL . S5",
        video: "./선녀vsPZ.mp4",
        story: "마지막 방의 문이 열리자, 공중에 부유하는 기괴한 저울 홀로그램이 푸른 빛을 내뿜습니다. 그 아래서 안개 같은 '선녀'와 강철의 'PZ'가 미라처럼 정지된 채 서로를 겨누고 있습니다. 저울이 요구하는 것은 오직 하나, 지금까지 왕자가 걸어오며 코어에 새긴 데이터의 실질적인 무게입니다.",
        choices: [
          { text: "숨을 죽이고 저울 위에 내 운명의 기록을 올려놓는다.", action: () => {
              let score = state.sync + state.integrity;
              if (state.hasKey || score >= 60) {
                showResultInGame("[JUDGMENT : 통과]\n체인이 풀리는 무거운 소리와 함께 마지막 게이트가 개방됩니다.", "S6");
              } else {
                openDefeatBranch();
              }
            } 
          }
        ]
      },
      S6: {
        title: "결말 — 마지막 가상 연회",
        badge: "SIGNAL . S6",
        video: "./가상연회.mp4",
        story: "사라져 가던 도시의 마지막 로그들이 밤하늘에 별빛 같은 찌꺼기로 흩어지며 기괴하고 아름다운 연회가 펼쳐집니다. 실시간으로 소멸하는 기억의 파편 속에서, 왕자의 선택이 남긴 최종 궤적이 서서히 떠오릅니다.",
        choices: [
          { text: "도시가 남긴 마지막 종말의 궤적을 확인한다.", action: () => { processEnding(); } }
        ]
      }
    };

    function startGame() {
      document.getElementById('opening-title-screen').style.display = 'none';
      document.getElementById('game-card').classList.remove('hidden');
      nextStage("S1");
    }

    function updateUI() {
      document.getElementById('stat-sync').innerText = state.sync;
      document.getElementById('stat-integrity').innerText = state.integrity;
      
      const noiseTag = document.getElementById('stat-noise');
      noiseTag.innerText = state.noise;
      if(state.noise >= 20) { noiseTag.classList.add('stat-critical'); } 
      else { noiseTag.classList.remove('stat-critical'); }

      document.getElementById('stat-key').innerText = state.hasKey ? "DECRYPTED" : "LOCKED";
    }

    // 🚨 [신규] 화면 안에서 연출 결과를 보여주고 다음으로 유도하는 인터페이스 브릿지 함수
    function showResultInGame(message, nextStageKey) {
      updateUI();
      
      const alertBox = document.getElementById('game-alert-box');
      alertBox.innerText = message;
      alertBox.classList.remove('hidden');

      // 선택지 영역을 '다음 사건으로...' 버튼 단 한 개로 교체
      const choiceContainer = document.getElementById('game-choices');
      choiceContainer.innerHTML = '';

      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.style.borderColor = 'var(--accent)';
      btn.style.color = 'var(--text-main)';
      btn.innerText = "심장의 진동을 따라 다음 연산 구역으로 진입한다 ➔";
      btn.onclick = () => {
        alertBox.classList.add('hidden'); // 경고 메세지 리셋
        nextStage(nextStageKey);
      };
      choiceContainer.appendChild(btn);
    }

    function nextStage(stageKey) {
      state.currentStage = stageKey;
      updateUI();

      const stage = STAGES[stageKey];
      document.getElementById('game-title').innerText = stage.title;
      document.getElementById('game-badge').innerText = stage.badge;
      document.getElementById('game-story').innerText = stage.story;
      document.getElementById('game-alert-box').classList.add('hidden'); // 안전 격리
      
      const videoTag = document.getElementById('game-video');
      videoTag.src = encodeURI(stage.video);
      videoTag.play().catch(e => {});

      const choiceContainer = document.getElementById('game-choices');
      choiceContainer.innerHTML = '';
      
      stage.choices.forEach((choice) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = choice.text;
        btn.onclick = choice.action;
        choiceContainer.appendChild(btn);
      });
    }

    function openDefeatBranch() {
      const alertBox = document.getElementById('game-alert-box');
      alertBox.innerText = "[SYSTEM CRITICAL : 심판 미달]\n저울의 균형이 급격히 무너지며 파멸의 차가운 경보가 온 감각을 잠식합니다.";
      alertBox.classList.remove('hidden');

      const choiceContainer = document.getElementById('game-choices');
      choiceContainer.innerHTML = '';

      const badChoices = [
        { text: "코어를 운명에 맡기고 주사위를 던진다 (실패 시 존재 소멸)", action: () => {
            if(Math.random() > 0.5) { 
              alertBox.classList.add('hidden');
              showResultInGame("[SYSTEM ANOMALY : 에러 발생]\n알 수 없는 데이터 왜곡으로 심판 저울 프로토콜이 강제 우회되었습니다.", "S6");
            } else { 
              forceBadEnd("인과율 왜곡 실패. 존재의 영구 소거."); 
            }
          }
        },
        { text: "관리자를 대면했던 그 서늘한 기둥의 방으로 의식을 루프시킨다.", action: () => { nextStage("S4"); } },
        { text: "레이저 격자가 요동치던 광장의 기억으로 타임 루프를 시도한다.", action: () => { nextStage("S3"); } }
      ];

      badChoices.forEach((choice) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.style.color = '#ff6b6b';
        btn.innerText = choice.text;
        btn.onclick = choice.action;
        choiceContainer.appendChild(btn);
      });
    }

    function processEnding() {
      document.getElementById('game-card').classList.add('hidden');
      const endScreen = document.getElementById('ending-screen');
      endScreen.classList.remove('hidden');

      const titleTag = document.getElementById('end-title');
      const descTag = document.getElementById('end-desc');

      if (state.sync >= 45) {
        titleTag.innerText = "🚩 [궤적: 혁명가] — 붉은 새벽의 파동";
        descTag.innerText = `심장 동조 수치 극대화됨.\n\n왕자가 선택한 과격한 동조는 도시를 지탱하던 왜곡된 마더보드를 송두리째 불태워버렸습니다. 거짓된 평화는 끝났고, 통제 불능의 자유를 맞이한 도시 아래에서 수많은 눈동자들이 눈을 뜹니다. 당신은 구원자일까요, 아니면 또 다른 재앙의 씨앗일까요.`;
      } else if (state.integrity >= 45) {
        titleTag.innerText = "🕊️ [궤적: 인간성 회복] — 침묵의 에덴";
        descTag.innerText = `잔존 가치 데이터 한계치 도달.\n\n무력을 쓰지 않고 축적해 온 왕자의 고결한 가치 찌꺼기들이 시스템의 중앙 연산을 정화하는 기적을 낳았습니다. 통제 드론들은 작동을 멈추었고, 소멸해가던 문명 위로 기묘할 정도로 따스하고 고요한 금빛 구원의 빛이 내려앉습니다.`;
      } else {
        forceBadEnd("가치 증명 실패로 인한 인과율 말소 조치.");
      }
    }

    function forceBadEnd(reason) {
      document.getElementById('game-card').classList.add('hidden');
      const endScreen = document.getElementById('ending-screen');
      endScreen.classList.remove('hidden');
      
      document.getElementById('end-title').innerText = "💀 [궤적: 소멸] — 포맷되는 잔해";
      document.getElementById('end-desc').innerText = `말소 원인 사유: ${reason}\n\n세상을 뒤엎을 파동도, 영혼을 증명할 가치도 남기지 못한 채 왕자의 녹슨 코어는 완전히 정지했습니다. '사라지는 도시'는 이름 그대로 중앙 서버의 차가운 명령에 의해 완전 삭제(Format)되어 암흑 속으로 침묵합니다.`;
    }

    function resetGame() {
      state = { sync: 0, integrity: 0, noise: 0, hasKey: false, currentStage: "S1" };
      document.getElementById('ending-screen').classList.add('hidden');
      document.getElementById('game-card').classList.add('hidden');
      document.getElementById('opening-title-screen').style.display = 'flex';
    }
  </script>
</body>
</html>
