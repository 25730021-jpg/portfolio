<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Luma & Suno Studio</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #0e0704;
      --card-bg: #1a100c;
      --card-inner: #261a15;
      --border: #3d2c24;
      --text-main: #f5f0ed;
      --text-sub: #b5a49c;
      --accent: #ff6b35;
      --accent-rgb: 255, 107, 53;
      --nav-bg: rgba(26, 16, 12, 0.85);
      --font: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text-main); padding-bottom: 90px; overflow-x: hidden; line-height: 1.4; letter-spacing: -0.3px; }

    /* 헤더 */
    header { background: var(--card-bg); padding: 20px 16px; border-bottom: 1px solid var(--border); text-align: center; }
    header h1 { font-size: 20px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    header h1 span { color: var(--accent); }
    header p { font-size: 13px; color: var(--text-sub); margin-top: 4px; font-weight: 500; }

    /* 메인 컨테이너 */
    main { max-width: 600px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }

    /* 섹션 타이틀 */
    .section-title { font-size: 14px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; padding-left: 2px; margin-bottom: -12px; display: flex; align-items: center; gap: 6px; }
    .section-title::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

    /* 카드 베이스 */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }

    /* 상단 비디오/이미지 영역 */
    .s-img { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; overflow: hidden; }
    .s-img video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    .scene-badge { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 30px; font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid rgba(255,107,53,0.3); z-index: 10; display: flex; align-items: center; gap: 4px; }
    .scene-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 60%, rgba(14,7,4,0.95)); z-index: 5; pointer-events: none; }

    /* 카드 콘텐츠 */
    .s-content { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; }
    .title-area h2 { font-size: 18px; font-weight: 700; color: var(--text-main); }
    .title-area p { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    
    /* 재생 제어 바 (TTS / 오디오용) */
    .play-bar { background: var(--card-inner); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
    .p-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; flex-shrink: 0; }
    .p-btn:active { transform: scale(0.92); }
    .p-btn svg { width: 16px; height: 16px; fill: #fff; margin-left: 2px; }
    .p-btn.playing svg { margin-left: 0; }
    .p-info { flex: 1; min-width: 0; }
    .p-info .p-title { font-size: 13px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-info .p-dur { font-size: 11px; color: var(--text-sub); margin-top: 1px; font-family: monospace; }

    /* 가사 / 프롬프트 텍스트 상자 */
    .text-box { background: var(--card-inner); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(255,255,255,0.02); }
    .tb-label { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }
    .tb-content { font-size: 13px; color: var(--text-sub); line-height: 1.5; white-space: pre-line; }

    /* 오디오 플레이어 숨김 태그 */
    audio { display: none; }

    /* 하단 탭 바 지지 */
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); height: 68px; display: flex; justify-content: space-around; align-items: center; padding: 0 24px; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); text-decoration: none; font-size: 10px; font-weight: 600; background: none; border: none; cursor: pointer; opacity: 0.6; transition: all 0.2s; }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; transition: transform 0.2s; }
    .nav-item.active { color: var(--accent); opacity: 1; }
    .nav-item:active svg { transform: scale(0.9); }
  </style>
</head>
<body>

  <header>
    <h1>Cinematic & <span>AI Video</span> Studio</h1>
    <p>Luma Dream Machine Generation Portfolio</p>
  </header>

  <main id="content-pool">
    </main>

  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('all', this)">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      ALL
    </button>
    <button class="nav-item" onclick="switchTab('video', this)">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      VIDEO
    </button>
    <button class="nav-item" onclick="switchTab('audio', this)">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      AUDIO
    </button>
  </nav>

  <script>
    /* ══════════════════════════════════
       데이터 정의 (새로 업로드하신 비디오 5종 연동)
       ══════════════════════════════════ */
    const DATA = [
      {
        id: "v1",
        type: "video",
        title: "Digital City Prince",
        sub: "Luma Dream Machine v1.5 • Cinematic",
        badge: "🎬 LUMA VIDEO",
        videoSrc: "./Prince_overlooks_digital_city_202606211615.mp4",
        prompt: "A neon-lit cyberpunk prince standing on a skyscraper balcony, overlooking a massive, glowing digital futuristic city at midnight. High cinematic details, soft reflections, smooth camera pans.",
        hasAudio: false
      },
      {
        id: "v2",
        type: "video",
        title: "가상연회",
        sub: "Luma Dream Machine • AI Video",
        badge: "🎬 LUMA VIDEO",
        videoSrc: "./가상연회.mp4",
        prompt: "가상 연회장 안에서 펼쳐지는 화려하고 환상적인 시네마틱 장면 비디오.",
        hasAudio: false
      },
      {
        id: "v3",
        type: "video",
        title: "금빛광장",
        sub: "Luma Dream Machine • AI Video",
        badge: "🎬 LUMA VIDEO",
        videoSrc: "./금빛광장.mp4",
        prompt: "금빛으로 아름답게 물든 광장과 그 주변을 부드럽게 비추는 카메라 무빙 시네마틱 영상.",
        hasAudio: false
      },
      {
        id: "v4",
        type: "video",
        title: "선녀 vs PZ",
        sub: "Luma Dream Machine • Battle Cinematic",
        badge: "🎬 LUMA VIDEO",
        videoSrc: "./선녀vsPZ.mp4",
        prompt: "선녀와 PZ 캐릭터 간의 역동적이고 화려한 비주얼 이펙트가 돋보이는 전투 장면.",
        hasAudio: false
      },
      {
        id: "v5",
        type: "video",
        title: "왕자 vs 관리자",
        sub: "Luma Dream Machine • Battle Cinematic",
        badge: "🎬 LUMA VIDEO",
        videoSrc: "./왕자vs관리자.mp4",
        prompt: "왕자와 관리자의 대립을 다룬 웅장하고 긴장감 넘치는 SF/판타지 시네마틱 대결 영상.",
        hasAudio: false
      }
    ];

    /* ══════════════════════════════════
       플레이어 핵심 로직 및 렌더링 함수
       ══════════════════════════════════ */
    let currentAudio = null;
    let currentBtn = null;

    function render(filter = 'all') {
      const pool = document.getElementById('content-pool');
      pool.innerHTML = '';

      const filtered = DATA.filter(d => filter === 'all' || d.type === filter);

      filtered.forEach(d => {
        const card = document.createElement('div');
        card.className = 'card';

        // 한글 파일명의 깨짐을 방지하기 위해 encodeURIComponent 기반 경로 처리 적용
        const encodedSrc = encodeURI(d.videoSrc);

        // 비디오 재생 영역 생성
        let mediaLayout = `
          <div class="s-img">
            <video src="${encodedSrc}" autoplay muted loop playsinline></video>
            <div class="scene-badge">${d.badge}</div>
            <div class="scene-overlay"></div>
          </div>
        `;

        // 프롬프트 또는 설명 상자 생성
        let textSection = `
          <div class="text-box">
            <div class="tb-label">AI Generation Prompt / Description</div>
            <div class="tb-content">${d.prompt}</div>
          </div>
        `;

        card.innerHTML = `
          ${mediaLayout}
          <div class="s-content">
            <div class="meta-row">
              <div class="title-area">
                <h2>${d.title}</h2>
                <p>${d.sub}</p>
              </div>
            </div>
            ${textSection}
          </div>
        `;
        pool.appendChild(card);
      });
    }

    /* ══════════════════════════════════
       네비게이션 탭 스위칭 함수
       ══════════════════════════════════ */
    function switchTab(type, btn) {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      btn.classList.add('active');
      render(type);
    }

    // 초기 화면 진입 시 전체 아이템 로드
    window.onload = () => render('all');
  </script>
</body>
</html>
