<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>행복한 왕자: 사라지는 도시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #030202;
      --card-bg: #090605;
      --card-inner: rgba(15, 10, 8, 0.6); 
      --border: #1f120c;
      --text-main: #dfdedd;
      --text-sub: #7a706b;
      --accent: #bf360c; 
      --ui-glow: rgba(191, 54, 12, 0.4); 
      --mystery-glow: rgba(122, 112, 107, 0.2); /* 🎨 미스터리한 흐릿한 글로우 */
      --font: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
    
    body { 
      background: var(--bg); 
      /* 🎨 배경: 더 복잡하고 흐릿한 디지털 노이즈 그리드 패턴 추가 */
      background-image: 
        linear-gradient(0deg, transparent 24%, rgba(20, 15, 12, 0.05) 25%, rgba(20, 15, 12, 0.05) 26%, transparent 27%, transparent 74%, rgba(20, 15, 12, 0.05) 75%, rgba(20, 15, 12, 0.05) 76%, transparent 77%, transparent),
        linear-gradient(90deg, transparent 24%, rgba(20, 15, 12, 0.05) 25%, rgba(20, 15, 12, 0.05) 26%, transparent 27%, transparent 74%, rgba(20, 15, 12, 0.05) 75%, rgba(20, 15, 12, 0.05) 76%, transparent 77%, transparent),
        radial-gradient(var(--mystery-glow) 1px, transparent 1px);
      background-size: 50px 50px, 50px 50px, 120px 120px;
      color: var(--text-main); 
      overflow-x: hidden; 
      line-height: 1.6; 
      letter-spacing: -0.5px; 
    }

    /* 오프닝 타이틀 */
    #opening-title-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #000;
      overflow: hidden;
    }
    #opening-bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translate(-50%, -50%);
      filter: brightness(0.6) contrast(1.2) grayscale(0.5); /* 🎨 미스터리한 회색조 추가 */
      z-index: 1;
    }
    .video-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 0%, rgba(3, 2, 2, 0.9) 100%);
      z-index: 2;
    }
    .title-logo-box { position: relative; z-index: 3; margin-bottom: 60px; text-shadow: 0 0 15px rgba(0,0,0,0.9); }
    .title-logo-box h1 { font-size: 36px; font-weight: 900; color: #fff; letter-spacing: -2px; line-height: 1.3; }
    .title-logo-box h1 span { color: var(--accent); text-shadow: 0 0 20px rgba(191,54,12,0.8); }
    .title-logo-box p { font-size: 10px; color: var(--text-sub); margin-top: 16px; font-weight: 500; letter-spacing: 6px; opacity: 0.6; }
    
    .start-game-btn {
      position: relative;
      z-index: 3;
      background: rgba(5, 3, 2, 0.9);
      border: 1px solid rgba(191, 54, 12, 0.5);
      color: var(--text-main);
      padding: 16px 54px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 2px;
      cursor: pointer;
      letter-spacing: 3px;
      backdrop-filter: blur(8px);
      transition: all 0.5s ease;
    }
    .start-game-btn:hover { background: var(--accent); color: #fff; border-color: #fff; box-shadow: 0 0 25px rgba(191,54,12,0.6); }

    /* 상단 데이터 계기판 */
    header { background: #000; padding: 14px; border-bottom: 1px solid var(--border); text-align: center; font-size: 12px; font-weight: 700; color: var(--text-sub); letter-spacing: 2px; text-transform: uppercase; }

    .status-panel { 
      max-width: 1200px; 
      margin: 20px auto 0 auto; 
      padding: 12px 16px; 
      background: rgba(9,6,5,0.8); 
      border: 1px solid rgba(31, 18, 12, 0.6); 
      border-radius: 2px; 
      display: flex; 
      justify-content: space-around; 
      align-items: center; 
      text-align: center; 
      box-shadow: 0 0 15px rgba(0,0,0,0.7);
    }
    .stat-box { flex: 1; }
    .stat-label { 
      font-size: 9px; 
      color: var(--text-sub); 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 4px;
    }
    /* 🎨 계기판 라벨 옆 미스터리 아이콘 추가 */
    .stat-label::before { content: '▰'; font-size: 8px; color: rgba(122, 112, 107, 0.5); }
    .stat-val { font-size: 14px; font-weight: 700; color: var(--text-main); margin-top: 4px; font-family: monospace; text-shadow: 0 0 5px rgba(223, 222, 221, 0.3); }
    .stat-critical { color: #d32f2f !important; text-shadow: 0 0 10px rgba(211,47,47,0.8); animation: blink 1s infinite; }
    /* 🎨 경고 수치 점멸 애니메이션 */
    @keyframes blink { 50% { opacity: 0.5; } }

    main { max-width: 1200px; margin: 16px auto; padding: 0 16px; }

    /* 가로 2단 레이아웃 컨테이너 */
    .game-container { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 4px; 
      overflow: hidden; 
      display: flex;
      flex-direction: row; 
      min-height: 600px;
      box-shadow: 0 0 30px rgba(191, 54, 12, 0.05); 
    }
    
    /* 좌측 비디오 영역 */
    .screen-area { 
      flex: 1.4; 
      background: #000; 
      position: relative; 
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 16/9;
      border-right: 1px solid rgba(31, 18, 12, 0.8);
    }
    .screen-area::before { 
      content: ''; position: absolute; top: 10px; left: 10px; width: 20px; height: 20px;
      border-top: 2px solid rgba(191, 54, 12, 0.3); border-left: 2px solid rgba(191, 54, 12, 0.3); z-index: 11;
    }
    .screen-area::after { 
      content: ''; position: absolute; bottom: 10px; right: 10px; width: 20px; height: 20px;
      border-bottom: 2px solid rgba(191, 54, 12, 0.3); border-right: 2px solid rgba(191, 54, 12, 0.3); z-index: 11;
    }

    .screen-area video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85) contrast(1.15); }
    .stage-badge { position: absolute; top: 14px; left: 14px; background: rgba(0,0,0,0.8); padding: 4px 10px; font-size: 9px; font-weight: 700; color: #d32f2f; border: 1px solid rgba(211,47,47,0.4); letter-spacing: 1px; font-family: monospace; z-index: 10; box-shadow: 0 0 10px rgba(211,47,47,0.3); }
    
    .condition-banner-area { position: absolute; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; z-index: 10; }
    .cond-banner { background: rgba(0,0,0,0.8); border: 1px solid #d32f2f; color: #d32f2f; font-size: 9px; font-weight: 900; padding: 3px 8px; border-radius: 1px; letter-spacing: 1px; box-shadow: 0 0 12px rgba(211,47,47,0.4); font-family: monospace; }
    
    .screen-overlay { 
      position: absolute; inset: 0; 
      background: linear-gradient(to bottom, transparent 65%, rgba(9,6,5,0.9) 100%); 
      pointer-events: none; z-index: 2; 
    }
    .scanlines { 
      position: absolute; inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
      background-size: 100% 4px;
      z-index: 3; pointer-events: none; opacity: 0.6;
    }

    /* 우측 콘텐츠 및 선택지 영역 */
    .content-area { 
      flex: 1; 
      padding: 24px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      background: #090605; 
      box-shadow: inset 10px 0 20px rgba(0,0,0,0.5); 
    }
    
    .content-top-group { display: flex; flex-direction: column; gap: 14px; }
    .stage-title { font-size: 16px; font-weight: 800; color: #fff; border-left: 2px solid var(--accent); padding-left: 10px; letter-spacing: -0.5px; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
    
    /* 지문창 패널 */
    .story-text { 
      font-size: 14px; color: #b5ada9; line-height: 1.7; 
      background: var(--card-inner); 
      padding: 16px; 
      border-radius: 2px; 
      border: 1px solid rgba(31, 18, 12, 0.6); 
      display: flex; flex-direction: column; gap: 12px; 
      max-height: 320px; overflow-y: auto; 
      backdrop-filter: blur(4px); 
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 0 10px rgba(191, 54, 12, 0.1);
      /* 🎨 지문창 희미한 데이터 글리치 애니메이션 */
      animation: text-glitch 10s infinite;
    }
    /* 🎨 희미한 데이터 글리치 효과 */
    @keyframes text-glitch { 
      0%, 90%, 100% { opacity: 1; transform: skew(0deg); }
      92% { opacity: 0.8; transform: skew(0.5deg); }
      94% { opacity: 1; transform: skew(0deg); }
      96% { opacity: 0.9; transform: skew(-0.3deg); }
    }
    
    .story-text::-webkit-scrollbar { width: 4px; }
    .story-text::-webkit-scrollbar-track { background: transparent; }
    .story-text::-webkit-scrollbar-thumb { background: rgba(31, 18, 12, 0.8); border-radius: 2px; }

    .system-alert-text { color: var(--accent); font-weight: 700; border-bottom: 1px dashed var(--border); padding-bottom: 10px; font-family: monospace; font-size: 13px; text-shadow: 0 0 8px var(--ui-glow); }

    /* 대사창 */
    .dialogue-box { background: rgba(3, 2, 2, 0.8); padding: 10px; border-left: 1px solid #554b45; margin-top: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
    .dialogue-box.prince { border-left-color: #9e9792; }
    .dialogue-box.swallow { border-left-color: #bfa03f; }
    .dialogue-box.pz { border-left-color: #a83232; }
    .dialogue-box.manager { border-left-color: #21736b; }
    
    .char-name { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; letter-spacing: 1px; color: var(--text-sub); }
    .dialogue-box.prince .char-name { color: #fff; text-shadow: 0 0 3px rgba(255,255,255,0.5); }
    .dialogue-box.swallow .char-name { color: #ffd54f; text-shadow: 0 0 5px rgba(255,213,79,0.4); }
    .dialogue-box.pz .char-name { color: #ef5350; text-shadow: 0 0 5px rgba(239,83,80,0.4); }
    .dialogue-box.manager .char-name { color: #26a69a; text-shadow: 0 0 5px rgba(38,166,154,0.4); }
    .char-line { font-style: normal; font-size: 13px; color: #dcd4cf; }

    /* 선택지 버튼 */
    .choice-area { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .choice-btn { 
      background: linear-gradient(135deg, rgba(12, 10, 9, 0.9) 0%, rgba(5, 3, 2, 1) 100%); 
      border: 1px solid var(--border); 
      color: var(--text-sub); 
      padding: 14px 18px; 
      border-radius: 2px; 
      font-size: 13px; font-weight: 600; text-align: left; 
      cursor: pointer; line-height: 1.4; 
      transition: all 0.4s ease; 
      position: relative; overflow: hidden;
    }
    .choice-btn::after { 
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: all 0.5s ease;
    }
    .choice-btn:hover { 
      border-color: var(--accent); 
      color: #fff; 
      background: rgba(20, 11, 7, 1); 
      box-shadow: 0 0 20px rgba(191,54,12,0.2), inset 0 0 10px rgba(191,54,12,0.1); 
    }
    .choice-btn:hover::after { left: 100%; } 

    .hidden { display: none !important; }
    .ending-box { background: #000; border: 1px solid #d32f2f; padding: 46px 24px; text-align: center; border-radius: 2px; margin-top: 20px; box-shadow: 0 0 30px rgba(211,47,47,0.15); }
    .ending-title { font-size: 19px; font-weight: 900; color: #fff; margin-bottom: 22px; letter-spacing: -1px; }
    .reset-btn { background: transparent; border: 1px solid var(--border); color: var(--text-sub); padding: 12px 32px; border-radius: 2px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 32px; letter-spacing: 1px; }
    .reset-btn:hover { border-color: #fff; color: #fff; background: #090605; }

    @media (max-width: 850px) {
      .game-container { flex-direction: column; min-height: auto; }
      .content-area { border-left: none; border-top: 1px solid var(--border); flex: none; width: 100%; box-shadow: inset 0 10px 20px rgba(0,0,0,0.5); }
      .screen-area { flex: none; width: 100%; aspect-ratio: 16/9; border-right: none; border-bottom: 1px solid rgba(31, 18, 12, 0.8); }
      .story-text { max-height: 250px; }
    }
  </style>
</head>
<body>

  <div id="opening-title-screen">
    <video id="opening-bg-video" src="./video/Prince_overlooks_digital_city_202606211615.mp4" autoplay muted loop playsinline preload="metadata"></video>
    <div class="video-overlay"></div>
    <div class="title-logo-box">
      <h1>행복한 왕자<br><span>사라지는 도시</span></h1>
      <p>MEMORIES IN THE RUSTED CODE</p>
    </div>
    <button class="start-game-btn" onclick="startGame()">동조 수신기 가동</button>
  </div>

  <header>SYSTEM INTERFACES // PROTOTYPE_v6</header>

  <div class="status-panel">
    <div class="stat-box"><div class="stat-label">Sync</div><div id="stat-sync" class="stat-val">00</div></div>
    <div class="stat-box" style="border-left: 1px solid rgba(31,18,12,0.4); border-right: 1px solid rgba(31,18,12,0.4);"><div class="stat-label">Integrity</div><div id="stat-integrity" class="stat-val">00</div></div>
    <div class="stat-box" style="border-right: 1px solid rgba(31,18,12,0.4);"><div class="stat-label">Erosion (Noise)</div><div id="stat-noise" class="stat-val">00</div></div>
    <div class="stat-box"><div class="stat-label">Core Flag</div><div id="stat-key" class="stat-val">LOCKED</div></div>
  </div>

  <main>
    <div class="game-container hidden" id="game-card">
      <div class="screen-area">
        <video id="game-video" src="" autoplay muted loop playsinline preload="metadata" controlslist="nodownload"></video>
        <div class="stage-badge" id="game-badge">LOG</div>
        <div class="condition-banner-area" id="banner-zone"></div>
        <div class="screen-overlay"></div>
        <div class="scanlines"></div> 
      </div>
      
      <div class="content-area">
        <div class="content-top-group">
          <div class="stage-title" id="game-title">수신 대기 중...</div>
          
          <div class="story-text">
            <div id="game-alert-box" class="system-alert-text hidden"></div>
            <div id="game-story">스캔 중...</div>
            <div id="game-dialogues"></div>
          </div>
        </div>

        <div class="choice-area" id="game-choices"></div>
      </div>
    </div>

    <div class="ending-box hidden" id="ending-screen">
      <div class="ending-title" id="end-title">최종 관측 보고서</div>
      <div class="story-text" id="end-desc">기록 소멸.</div>
      <button class="reset-btn" onclick="resetGame()">루프 재접속</button>
    </div>
  </main>

  <script>
    let state = { sync: 0, integrity: 0, noise: 0, s2a: false, s3a: false, key: false, currentStage: "S1" };

    const STAGES = {
      S1: {
        title: "S1 · 탑 관측",
        badge: "STATUS: ISOLATED",
        video: "./video/Prince_standing_atop_spire_202606221427.mp4", 
        story: "황혼빛 잿빛 도시 스카이라인. 탑 꼭대기. 왕자의 코어 점멸. 탑 꼭대기에서 도시의 신음 소리가 멀리서 울려온다. 왕자의 심장부, 녹슨 코어가 느리게 명멸한다.",
        getBanners: () => [],
        getDialogues: () => [
          { char: "prince", name: "Prince", line: "이제 더는 지켜보지 않는다. 움직여야 한다." },
          { char: "prince", name: "Prince", line: "저 아래에서 무언가 무너지고 있다. 나는 그것을 느낀다." }
        ],
        choices: () => [
          { text: "[A] 직접 개입 ➔ (Sync +20, Noise +5)", action: () => { state.sync += 20; state.noise += 5; nextStage("S2"); } },
          { text: "[B] 관찰 축적 ➔ (Integrity +20)", action: () => { state.integrity += 20; nextStage("S2"); } }
        ]
      },
      S2: {
        title: "S2 · 거리 그림자",
        badge: "SIGNAL . S2",
        video: "./video/prince_vs_manager.mp4", 
        story: "어두운 골목. 양쪽 벽 사이 좁은 원근. 관리자의 압박 신호가 벽면에서 기괴하게 점멸하고 있다.",
        getBanners: () => {
          let list = [];
          if (state.sync >= 20) list.push("균열 가시화");
          if (state.integrity >= 15) list.push("시민 호감");
          return list;
        },
        getDialogues: () => [
          { char: "swallow", name: "Swallow", line: "너의 선택은 아직 순수해. 길을 알려줄까?" },
          { char: "prince", name: "Prince", line: "...시간이 별로 없다." }
        ],
        choices: () => [
          { text: "[A] 직접 개입 ➔ (Sync +15, 제비 비협조 플래그)", action: () => { state.sync += 15; state.s2a = false; nextStage("S3"); } },
          { text: "[B] 정보 수집 ➔ (Integrity +12, 제비 가이드 플래그)", action: () => { state.integrity += 12; state.s2a = true; nextStage("S3"); } }
        ]
      },
      S3: {
        title: "S3 · 금빛 광장 [핵심 분기]",
        badge: "SIGNAL . S3",
        video: "./video/gold_square.mp4", 
        story: "레이저 격자 광장. 회청색 격자선과 감시 노드의 스캔 포인트가 공중에서 차갑게 교차하며 사방을 수색한다.",
        getBanners: () => {
          let list = [];
          if (state.noise >= 20) list.push("PZ 추격 드론");
          return list;
        },
        getDialogues: () => {
          let dialogs = [];
          if (state.s2a) {
            dialogs.push({ char: "swallow", name: "Swallow", line: "신뢰해준다면, 길을 찾겠습니다. (제비가 선제적으로 접근합니다.)" });
          }
          dialogs.push({ char: "pz", name: "PZ", line: "개입 로그 감지. 격리 프로토콜 실행. 5초 전." });
          if (!state.s2a) {
            dialogs.push({ char: "swallow", name: "Swallow", line: "신뢰해준다면, 길을 찾겠습니다." });
          }
          dialogs.push({ char: "prince", name: "Prince", line: "제비... 네가 옳다면 나는 믿겠다." });
          return dialogs;
        },
        choices: () => [
          { text: "[A] 제비 협력 ➔ (Integrity +18, 협력루트 확정)", action: () => { state.integrity += 18; state.s3a = true; nextStage("S4"); } },
          { text: "[B] 독자 돌파 ➔ (Sync +18, 독자루트 확정)", action: () => { state.sync += 18; state.s3a = false; nextStage("S4"); } }
        ]
      },
      S4: {
        title: "S4 · 관리자 접근 [체크포인트]",
        badge: "CHECKPOINT . A",
        video: "./video/Prince_hacks_security_matrix_Admin_202606221445.mp4", 
        story: "금속 기둥 4개와 중앙을 부유하는 홀로그램 패널. 차가운 연산 스캔라인이 위아래로 기괴하게 움직인다.",
        getBanners: () => {
          let list = [];
          if (state.s3a) list.push("제비 가이드");
          if (state.integrity + state.sync < 20) list.push("경고음");
          return list;
        },
        getDialogues: () => [
          { char: "manager", name: "Manager", line: "너의 흔적은 시스템을 오염시킨다. 순응하라." },
          { char: "prince", name: "Prince", line: "이 고통을 외면할 수 없다. 차가운 질서여도 눈물은 흐른다." }
        ],
        choices: () => [
          { text: "[A] 매수 시도 ➔ (Integrity -12, Key=false)", action: () => { state.integrity -= 12; state.key = false; showResultInGame("[SYSTEM WARNING]\n매수 시도가 파기되며 리소스를 낭비했습니다. 연산 수신기 파동을 이어갑니다.", "S5"); } },
          { text: "[B] 해킹 우회 ➔ (Sync +16, Key=true)", action: () => { state.sync += 16; state.key = true; showResultInGame("[SYSTEM SUCCESS]\n서버 백도어 해킹에 성공하여 강제로 해독 코드(Key)를 주입했습니다.", "S5"); } },
          { 
            text: `[C] 설득 시도 ➔ (Integrity +10, Sync +5, Key=true) [가치 40이상]`, 
            action: () => { 
              if(state.integrity >= 40) {
                state.integrity += 10; state.sync += 5; state.key = true;
                showResultInGame("[SYSTEM EXCELLENT]\n윤리적 데이터의 완벽한 논증으로 관리망으로부터 코어 해독 코드를 획득했습니다.", "S5"); 
              } else {
                state.noise += 15;
                showResultInGame("[SYSTEM FAIL]\n증명 가치가 부족해 연산 거부 처리되었습니다. 시스템 오염도가 역류합니다.", "S5");
              }
            } 
          }
        ]
      },
      S5: {
        title: "S5 · 최종 코어 — 선녀 vs PZ",
        badge: "FINAL AREA",
        video: "./video/fairy_vs_pz.mp4", 
        story: "마지막 방의 제단. 부유하는 시스템 핵심 저울 장치 앞에서 선녀 프로토콜과 강철의 PZ가 동조 파동을 대기 중입니다.",
        getBanners: () => [],
        getDialogues: () => [
          { char: "prince", name: "Prince", line: "여기가 마지막 연산지인가... 마주해야 할 최종 결과가 기다린다." }
        ],
        choices: () => [
          { text: "가상 연회의 장으로 진입하여 최종 수치 판정에 개시한다. ➔", action: () => { nextStage("S6"); } }
        ]
      },
      S6: {
        title: "S6 · 가상 연회 [최종 수치 판정]",
        badge: "VIRTUAL BANQUET",
        video: "./video/virtual_banquet.mp4", 
        story: "사라져 가던 도시의 마지막 연산 로그들이 불꽃처럼 흩어지며 가상 연회가 펼쳐집니다. 이곳에서 당신이 누적해 온 심장의 동조율(Sync)과 잔존 가치(Integrity)의 최종 인과율 궤적이 연산됩니다.",
        getBanners: () => [],
        getDialogues: () => [
          { char: "prince", name: "Prince", line: "나의 궤적이 새겨진 회로의 끝에 선다. 연회를 멈추고 결과를 관측하라." }
        ],
        choices: () => [
          { text: "최종 관측 보고서 출력하기 ➔", action: () => { processEnding(); } }
        ]
      }
    };

    function startGame() {
      document.getElementById('opening-title-screen').style.display = 'none';
      document.getElementById('game-card').classList.remove('hidden');
      
      const openVideo = document.getElementById('opening-bg-video');
      openVideo.preload = "metadata";
      
      nextStage("S1");
    }

    function updateUI() {
      document.getElementById('stat-sync').innerText = state.sync;
      document.getElementById('stat-integrity').innerText = state.integrity;
      
      const noiseTag = document.getElementById('stat-noise');
      noiseTag.innerText = state.noise;
      if(state.noise >= 20) { noiseTag.classList.add('stat-critical'); } 
      else { noiseTag.classList.remove('stat-critical'); }

      document.getElementById('stat-key').innerText = state.key ? "TRUE" : "LOCKED";
    }

    function showResultInGame(message, nextStageKey) {
      updateUI();
      const alertBox = document.getElementById('game-alert-box');
      alertBox.innerText = message;
      alertBox.classList.remove('hidden');

      const choiceContainer = document.getElementById('game-choices');
      choiceContainer.innerHTML = '';

      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.style.borderColor = 'var(--accent)';
      btn.style.color = '#fff';
      btn.innerText = "연산 구역 계속 이동하기 ➔";
      
      btn.onclick = function() {
        alertBox.classList.add('hidden');
        nextStage(nextStageKey);
      };
      choiceContainer.appendChild(btn);
    }

    function nextStage(stageKey) {
      if (!STAGES[stageKey])  stageKey = "S1";

      state.currentStage = stageKey;
      updateUI();

      const stage = STAGES[stageKey];
      document.getElementById('game-title').innerText = stage.title;
      document.getElementById('game-badge').innerText = stage.badge;
      document.getElementById('game-story').innerText = stage.story;
      document.getElementById('game-alert-box').classList.add('hidden');
      
      const videoTag = document.getElementById('game-video');
      videoTag.muted = true;
      videoTag.removeAttribute('src'); 
      videoTag.src = stage.video;
      videoTag.preload = "metadata";   
      videoTag.load();                 
      
      const playPromise = videoTag.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => { console.log("자동재생 제한 감지 우회"); });
      }

      // 배너 갱신
      const bannerZone = document.getElementById('banner-zone');
      bannerZone.innerHTML = '';
      stage.getBanners().forEach(bannerText => {
        const span = document.createElement('div');
        span.className = 'cond-banner';
        span.innerText = bannerText;
        bannerZone.appendChild(span);
      });

      // 대사 갱신
      const dialogueContainer = document.getElementById('game-dialogues');
      dialogueContainer.innerHTML = '';
      stage.getDialogues().forEach(d => {
        const box = document.createElement('div');
        box.className = `dialogue-box ${d.char}`;
        box.innerHTML = `<div class="char-name">${d.name}</div><div class="char-line">"${d.line}"</div>`;
        dialogueContainer.appendChild(box);
      });

      // 선택지 버튼 렌더링
      const choiceContainer = document.getElementById('game-choices');
      choiceContainer.innerHTML = '';
      
      const currentChoices = stage.choices();
      for (let i = 0; i < currentChoices.length; i++) {
        const choice = currentChoices[i];
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = choice.text;
        btn.onclick = choice.action; 
        choiceContainer.appendChild(btn);
      }
    }

    function processEnding() {
      document.getElementById('game-card').classList.add('hidden');
      const endScreen = document.getElementById('ending-screen');
      endScreen.classList.remove('hidden');

      const titleTag = document.getElementById('end-title');
      const descTag = document.getElementById('end-desc');

      if (state.sync >= 45) {
        titleTag.innerText = "🚩 [END_A] 혁명가형 — 붉은 새벽의 파동";
        descTag.innerText = `최종 데이터 산출 ➔ Sync: ${state.sync}, Integrity: ${state.integrity}, Erosion: ${state.noise}\n\n최고치에 도달한 주파수 동조율이 도시를 결착하고 있던 부정한 마더보드 서버를 송두리째 불태우고 통제 체제를 붕괴시켰습니다. 새로운 파동의 시작입니다.`;
      } else if (state.integrity >= 45) {
        titleTag.innerText = "🕊️ [END_B] 인간성 회복 — 침묵의 에덴";
        descTag.innerText = `최종 데이터 산출 ➔ Sync: ${state.sync}, Integrity: ${state.integrity}, Erosion: ${state.noise}\n\n축적된 인간성의 가치 조각들이 중앙 코어의 모순 연산을 기적적으로 정화했습니다. 소멸을 멈춘 도시는 안온하고 평화로운 침묵 속에 영원히 보존됩니다.`;
      } else {
        titleTag.innerText = "💀 [Bad End] \"도시가 정지했다\"";
        descTag.innerText = `최종 데이터 산출 ➔ Sync: ${state.sync}, Integrity: ${state.integrity}, Erosion: ${state.noise}\n\n기준 판정 수치 미달. 도시를 재구동하거나 해방할 그 어떤 가치 파동도 증명해내지 못했습니다. 중앙 인과율 통제 프로토콜에 의해 연회가 강제 종료되며, 모든 스캔라인이 암흑 속으로 사라지고 회로가 차갑게 얼어붙습니다.`;
      }
    }

    function resetGame() {
      state = { sync: 0, integrity: 0, noise: 0, s2a: false, s3a: false, key: false, currentStage: "S1" };
      document.getElementById('ending-screen').classList.add('hidden');
      document.getElementById('opening-title-screen').style.display = 'flex';
    }
  </script>
</body>
</html>
