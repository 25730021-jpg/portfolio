<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>행복한 왕자: 사라지는 도시</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    :root {
      --bg: #050302;
      --card-bg: #120906;
      --card-inner: #1a0f0a;
      --border: #2b170e;
      --text-main: #ebdcd5;
      --text-sub: #9e8a80;
      --accent: #e64a19;
      --font: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
    body { background: var(--bg); color: var(--text-main); padding-bottom: 60px; overflow-x: hidden; line-height: 1.6; letter-spacing: -0.4px; }

    /* 오프닝 타이틀 */
    #opening-title-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #000;
      overflow: hidden;
    }
    #opening-bg-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translate(-50%, -50%);
      filter: brightness(0.4) contrast(1.2) blur(1px);
      z-index: 1;
    }
    .video-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(12, 6, 4, 0.4) 0%, rgba(5, 3, 2, 0.85) 100%);
      z-index: 2;
    }
    .title-logo-box { position: relative; z-index: 3; margin-bottom: 50px; animation: glitchGlow 4s infinite alternate; }
    .title-logo-box h1 { font-size: 38px; font-weight: 900; color: var(--text-main); letter-spacing: -1.5px; line-height: 1.3; }
    .title-logo-box h1 span { color: var(--accent); text-shadow: 0 0 25px rgba(230,74,25,0.6); }
    .title-logo-box p { font-size: 11px; color: var(--text-sub); margin-top: 14px; font-weight: 400; letter-spacing: 5px; opacity: 0.8; }
    
    .start-game-btn {
      position: relative;
      z-index: 3;
      background: rgba(18, 9, 6, 0.8);
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 18px 50px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 2px;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 20px rgba(230,74,25,0.15);
      transition: all 0.4s ease;
    }
    .start-game-btn:hover { background: var(--accent); color: #fff; box-shadow: 0 0 30px rgba(230,74,25,0.4); transform: scale(1.02); }

    /* 상단 데이터 계기판 */
    header { background: #0c0604; padding: 16px; border-bottom: 1px solid var(--border); text-align: center; font-size: 15px; font-weight: 700; color: var(--text-sub); letter-spacing: 1px; }

    .status-panel { max-width: 650px; margin: 20px auto 0 auto; padding: 14px 18px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; display: flex; justify-content: space-around; align-items: center; text-align: center; opacity: 0.8; }
    .stat-box { flex: 1; }
    .stat-label { font-size: 10px; color: var(--text-sub); font-weight: 500; }
    .stat-val { font-size: 15px; font-weight: 700; color: var(--text-main); margin-top: 4px; font-family: monospace; }
    .stat-critical { color: var(--accent) !important; text-shadow: 0 0 8px rgba(230,74,25,0.5); }

    main { max-width: 650px; margin: 20px auto; padding: 0 16px; }

    /* 카드 프레임 */
    .game-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 16px 44px rgba(0,0,0,0.7); }
    
    .screen-area { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
    .screen-area video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7) contrast(1.1); }
    .stage-badge { position: absolute; top: 14px; left: 14px; background: rgba(5,3,2,0.85); padding: 5px 12px; font-size: 10px; font-weight: 600; color: var(--text-sub); border: 1px solid var(--border); letter-spacing: 1px; }
    
    .condition-banner-area { position: absolute; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .cond-banner { background: rgba(230, 74, 25, 0.2); border: 1px solid var(--accent); color: #fff; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 2px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 0 10px rgba(230,74,25,0.2); }
    
    .screen-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, rgba(18,9,6,0.98)); pointer-events: none; }

    .content-area { padding: 30px 24px 24px 24px; display: flex; flex-direction: column; gap: 20px; background: linear-gradient(to bottom, rgba(18,9,6,0) 0%, #120906 100%); }
    .stage-title { font-size: 18px; font-weight: 700; color: var(--text-main); border-left: 3px solid var(--accent); padding-left: 12px; }
    
    .story-text { font-size: 14.5px; color: var(--text-sub); line-height: 1.8; background: rgba(26, 15, 10, 0.5); padding: 22px 20px; border-radius: 6px; border: 1px solid rgba(43, 23, 14, 0.3); display: flex; flex-direction: column; gap: 14px; }
    .system-alert-text { color: var(--accent); font-weight: 700; border-bottom: 1px dashed rgba(230,74,25,0.4); padding-bottom: 10px; font-family: monospace; }

    /* 캐릭터 대사창 */
    .dialogue-box { background: rgba(5, 3, 2, 0.4); padding: 12px 14px; border-left: 2px solid var(--text-sub); margin-top: 4px; }
    .dialogue-box.prince { border-left-color: var(--text-main); }
    .dialogue-box.swallow { border-left-color: #ffd54f; }
    .dialogue-box.pz { border-left-color: #ef5350; }
    .dialogue-box.manager { border-left-color: #26a69a; }
    .char-name { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; color: var(--text-sub); }
    .dialogue-box.prince .char-name { color: var(--text-main); }
    .dialogue-box.swallow .char-name { color: #ffd54f; }
    .dialogue-box.pz .char-name { color: #ef5350; }
    .dialogue-box.manager .char-name { color: #26a69a; }
    .char-line { font-style: italic; font-size: 13.5px; color: var(--text-main); }

    .choice-area { display: flex; flex-direction: column; gap: 12px; }
    .choice-btn { background: var(--card-inner); border: 1px solid var(--border); color: var(--text-sub); padding: 18px 22px; border-radius: 4px; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; line-height: 1.5; transition: all 0.3s; }
    .choice-btn:hover { border-color: var(--accent); color: var(--text-main); background: #21120b; }

    .hidden { display: none !important; }
    .ending-box { background: #0c0604; border: 1px solid var(--border); padding: 40px 24px; text-align: center; border-radius: 8px; margin-top: 20px; }
    .ending-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 20px; }
    .reset-btn { background: transparent; border: 1px solid var(--border); color: var(--text-sub); padding: 14px 36px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 30px; }
    .reset-btn:hover { border-color: var(--accent); color: var(--text-main); }
  </style>
</head>
<body>

  <div id="opening-title-screen">
    <video id="opening-bg-video" src="./Prince_overlooks_digital_city_202606211615.mp4" autoplay muted loop playsinline></video>
    <div class="video-overlay"></div>
    <div class="title-logo-box">
      <h1>행복한 왕자<br><span>사라지는 도시</span></h1>
      <p>MEMORIES IN THE RUSTED CODE</p>
    </div>
    <button class="start-game-btn" onclick="startGame()">동조 수신기 가동</button>
  </div>

  <header>행복한 왕자 : 사라지는 도시</header>

  <div class="status-panel">
    <div class="stat-box">
      <div class="stat-label">Sync (동조)</div>
      <div id="stat-sync" class="stat-val">00</div>
    </div>
    <div class="stat-box" style="border-left: 1px solid var(--border); border-right: 1px solid var(--border);">
      <div class="stat-label">Integrity (가치)</div>
      <div id="stat-integrity" class="stat-val">00</div>
    </div>
    <div class="stat-box" style="border-right: 1px solid var(--border);">
      <div class="stat-label">Erosion (침식/Noise)</div>
      <div id="stat-noise" class="stat-val">00</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Core Flag (해독)</div>
      <div id="stat-key" class="stat-val">LOCKED</div>
    </div>
  </div>

  <main>
    <div class="game-container hidden" id="game-card">
      <div class="screen-area">
        <video id="game-video" src="" autoplay muted loop playsinline></video>
        <div class="stage-badge" id="game-badge">LOG</div>
        <div class="condition-banner-area" id="banner-zone"></div>
        <div class="screen-overlay"></div>
      </div>
      <div class="content-area">
        <div class="stage-title" id="game-title">수신 대기 중...</div>
        
        <div class="story-text">
          <div id="game-alert-box" class="system-alert-text hidden"></div>
          <div id="game-story">스캔 중...</div>
          <div id="game-dialogues"></div>
        </div>

        <div class="choice-area" id="game-choices"></div>
      </div>
    </div>

    <div class="ending-box hidden" id="ending-screen">
      <div class="ending-title" id="end-title">최종 관측 보고서</div>
      <div class="story-text" id="end-desc">기록 소멸.</div>
      <button class="reset-btn" onclick="resetGame()">루프 재접속</button>
    </div>
  </main>

  <script>
    let state = { sync: 0, integrity: 0, noise: 0, s2a: false, s3a: false, key: false, currentStage: "S1" };

    // 🚨 [영문 주소 대수술] 한글 파일 깨짐 현상을 완전히 박멸하기 위해 경로를 순수 영어 파일명으로 교체했습니다.
    const STAGES = {
      S1: {
        title: "S1 · 탑 관측",
        badge: "STATUS: ISOLATED",
        video: "Prince_overlooks_digital_city_202606211615.mp4",
        story: "황혼빛 잿빛 도시 스카이라인. 탑 꼭대기. 왕자의 코어 점멸. 탑 꼭대기에서 도시의 신음 소리가 멀리서 울려온다. 왕자의 심장부, 녹슨 코어가 느리게 명멸한다.",
        getBanners: () => [],
        getDialogues: () => [
          { char: "prince", name: "Prince", line: "이제 더는 지켜보지 않는다. 움직여야 한다." },
          { char: "prince", name: "Prince", line: "저 아래에서 무언가 무너지고 있다. 나는 그것을 느낀다." }
        ],
        choices: () => [
          { text: "[A] 직접 개입 ➔ (Sync +20, Noise +5)", action: () => { state.sync += 20; state.noise += 5; nextStage("S2"); } },
          { text: "[B] 관찰 축적 ➔ (Integrity +20)", action: () => { state.integrity += 20; nextStage("S2"); } }
        ]
      },
      S2: {
        title: "S2 · 거리 그림자",
        badge: "SIGNAL . S2",
        video: "gold_square.mp4", 
        story: "어두운 골목. 양쪽 벽 사이 좁은 원근. 관리자의 압박 신호가 벽면에서 기괴하게 점멸하고 있다.",
        getBanners: () => {
          let list = [];
          if (state.sync >= 20) list.push("균열 가시화");
          if (state.integrity >= 15) list.push("시민 호감");
          return list;
        },
        getDialogues: () => [
          { char: "swallow", name: "Swallow", line: "너의 선택은 아직 순수해. 길을 알려줄까?" },
          { char: "prince", name: "Prince", line: "...시간이 별로 없다." }
        ],
        choices: () => [
          { text: "[A] 직접 개입 ➔ (Sync +15, 제비 비협조 플래그)", action: () => { state.sync += 15; state.s2a = false; nextStage("S3"); } },
          { text: "[B] 정보 수집 ➔ (Integrity +12, 제비 가이드 플래그)", action: () => { state.integrity += 12; state.s2a = true; nextStage("S3"); } }
        ]
      },
      S3: {
        title: "S3 · 금빛 광장 [핵심 분기]",
        badge: "SIGNAL . S3",
        video: "gold_square.mp4",
        story: "레이저 격자 광장. 회청색 격자선과 감시 노드의 스캔 포인트가 공중에서 차갑게 교차하며 사방을 수색한다.",
        getBanners: () => {
          let list = [];
          if (state.noise >= 20) list.push("PZ 추격 드론");
          return list;
        },
        getDialogues: () => {
          let dialogs = [];
          if (state.s2a) {
            dialogs.push({ char: "swallow", name: "Swallow", line: "신뢰해준다면, 길을 찾겠습니다. (제비가 선제적으로 접근합니다.)" });
          }
          dialogs.push({ char: "pz", name: "PZ", line: "개입 로그 감지. 격리 프로토콜 실행. 5초 전." });
          if (!state.s2a) {
            dialogs.push({ char: "swallow", name: "Swallow", line: "신뢰해준다면, 길을 찾겠습니다." });
          }
          dialogs.push({ char: "prince", name: "Prince", line: "제비... 네가 옳다면 나는 믿겠다." });
          return dialogs;
        },
        choices: () => [
          { text: "[A] 제비 협력 ➔ (Integrity +18, 협력루트 확정)", action: () => { state.integrity += 18; state.s3a = true; nextStage("S4"); } },
          { text: "[B] 독자 돌파 ➔ (Sync +18, 독자루트 확정)", action: () => { state.sync += 18; state.s3a = false; nextStage("S4"); } }
        ]
      },
      S4: {
        title: "S4 · 관리자 접근 [체크포인트]",
        badge: "CHECKPOINT . A",
        video: "prince_vs_manager.mp4",
        story: "금속 기둥 4개와 중앙을 부유하는 홀로그램 패널. 차가운 연산 스캔라인이 위아래로 기괴하게 움직인다.",
        getBanners: () => {
          let list = [];
          if (state.s3a) list.push("제비 가이드");
          if (state.integrity + state.sync < 20) list.push("경고음");
          return list;
        },
        getDialogues: () => [
          { char: "manager", name: "Manager", line: "너의 흔적은 시스템을 오염시킨다. 순응하라." },
          { char: "prince", name: "Prince", line: "이 고통을 외면할 수 없다. 차가운 질서여도 눈물은 흐른다." }
        ],
        choices: () => [
          { text: "[A] 매수 시도 ➔ (Integrity -12, Key=false)", action: () => { state.integrity -= 12; state.key = false; showResultInGame("[SYSTEM WARNING]\n매수 시도가 파기되며 리소스를 낭비했습니다. 연산 수신기 파동을 이어갑니다.", "S5"); } },
          { text: "[B] 해킹 우회 ➔ (Sync +16, Key=true)", action: () => { state.sync += 16; state.key = true; showResultInGame("[SYSTEM SUCCESS]\n서버 백도어 해킹에 성공하여 강제로 해독 코드(Key)를 주입했습니다.", "S5"); } },
          { 
            text: `[C] 설득 시도 ➔ (Integrity +10, Sync +5, Key=true) [권장: 가치 40이상]`, 
            action: () => { 
              if(state.integrity >= 40) {
                state.integrity += 10; state.sync += 5; state.key = true;
                showResultInGame("[SYSTEM EXCELLENT]\n윤리적 데이터의 완벽한 논증으로 관리망으로부터 코어 해독 코드를 획득했습니다.", "S5"); 
              } else {
                state.noise += 15;
                showResultInGame("[SYSTEM FAIL]\n증명 가치가 부족해 연산 거부 처리되었습니다. 시스템 오염도가 역류합니다.", "S5");
              }
            } 
          }
        ]
      },
      S5: {
        title: "S5 · 최종 코어 — 선녀 vs PZ",
        badge: "FINAL AREA",
        video: "fairy_vs_pz.mp4",
        story: "마지막 방의 제단. 부유하는 시스템 핵심 저울 장치 앞에서 선녀 프로토콜과 강철의 PZ가 동조 파동을 대기 중입니다.",
        getBanners: () => [],
        getDialogues: () => [
          { char: "prince", name: "Prince", line: "여기가 마지막 연산지인가... 마주해야 할 최종 결과가 기다린다." }
        ],
        choices: () => [
          { text: "가상 연회의 장으로 진입하여 최종 수치 판정을 개시한다. ➔", action: () => { nextStage("S6"); } }
        ]
      },
      S6: {
        title: "S6 · 가상 연회 [최종 수치 판정]",
        badge: "VIRTUAL BANQUET",
        video: "virtual_banquet.mp4",
        story: "사라져 가던 도시의 마지막 연산 로그들이 불꽃처럼 흩어지며 가상 연회가 펼쳐집니다. 이곳에서 당신이 누적해 온 심장의 동조율(Sync)과 잔존 가치(Integrity)의 최종 인과율 궤적이 연산됩니다.",
        getBanners: () => [],
        getDialogues: () => [
          { char: "prince", name: "Prince", line: "나의 궤적이 새겨진 회로의 끝에 선다. 연회를 멈추고 결과를 관측하라." }
        ],
        choices: () => [
          { text: "최종 관측 보고서 출력하기 ➔", action: () => { processEnding(); } }
        ]
      }
    };

    function startGame() {
      document.getElementById('opening-title-screen').style.display = 'none';
      document.getElementById('game-card').classList.remove('hidden');
      nextStage("S1");
    }

    function updateUI() {
      document.getElementById('stat-sync').innerText = state.sync;
      document.getElementById('stat-integrity').innerText = state.integrity;
      
      const noiseTag = document.getElementById('stat-noise');
      noiseTag.innerText = state.noise;
      if(state.noise >= 20) { noiseTag.classList.add('stat-critical'); } 
      else { noiseTag.classList.remove('stat-critical'); }

      document.getElementById('stat-key').innerText = state.key ? "DECRYPTED (TRUE)" : "LOCKED (FALSE)";
    }

    function showResultInGame(message, nextStageKey) {
      updateUI();
      const alertBox = document.getElementById('game-alert-box');
      alertBox.innerText = message;
      alertBox.classList.remove('hidden');

      const choiceContainer = document.getElementById('game-choices');
      choiceContainer.innerHTML = '';

      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.style.borderColor = 'var(--accent)';
      btn.style.color = 'var(--text-main)';
      btn.innerText = "연산 구역 계속 이동하기 ➔";
      btn.onclick = () => {
        alertBox.classList.add('hidden');
        nextStage(nextStageKey);
      };
      choiceContainer.appendChild(btn);
    }

    function nextStage(stageKey) {
      state.currentStage = stageKey;
      updateUI();

      const stage = STAGES[stageKey];
      document.getElementById('game-title').innerText = stage.title;
      document.getElementById('game-badge').innerText = stage.badge;
      document.getElementById('game-story').innerText = stage.story;
      document.getElementById('game-alert-box').classList.add('hidden');
      
      const videoTag = document.getElementById('game-video');
      videoTag.src = "./" + stage.video; // 인코딩 함수 걷어내고 다이렉트 영어 호출
      videoTag.play().catch(e => { console.log("비디오 재생 오류 방지 처리"); });

      // 배너 갱신
      const bannerZone = document.getElementById('banner-zone');
      bannerZone.innerHTML = '';
      stage.getBanners().forEach(bannerText => {
        const span = document.createElement('div');
        span.className = 'cond-banner';
        span.innerText = bannerText;
        bannerZone.appendChild(span);
      });

      // 대사 갱신
      const dialogueContainer = document.getElementById('game-dialogues');
      dialogueContainer.innerHTML = '';
      stage.getDialogues().forEach(d => {
        const box = document.createElement('div');
        box.className = `dialogue-box ${d.char}`;
        box.innerHTML = `<div class="char-name">${d.name}</div><div class="char-line">"${d.line}"</div>`;
        dialogueContainer.appendChild(box);
      });

      // 선택지 갱신
      const choiceContainer = document.getElementById('game-choices');
      choiceContainer.innerHTML = '';
      stage.choices().forEach((choice) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = choice.text;
        btn.onclick = choice.action;
        choiceContainer.appendChild(btn);
      });
    }

    function processEnding() {
      document.getElementById('game-card').classList.add('hidden');
      const endScreen = document.getElementById('ending-screen');
      endScreen.classList.remove('hidden');

      const titleTag = document.getElementById('end-title');
      const descTag = document.getElementById('end-desc');

      if (state.sync >= 45) {
        titleTag.innerText = "🚩 [END_A] 혁명가형 — 붉은 새벽의 파동";
        descTag.innerText = `최종 데이터 산출 ➔ Sync: ${state.sync}, Integrity: ${state.integrity}, Erosion: ${state.noise}\n\n최고치에 도달한 주파수 동조율이 도시를 결착하고 있던 부정한 마더보드 서버를 송두리째 불태우고 통제 체제를 붕괴시켰습니다. 새로운 파동의 시작입니다.`;
      } else if (state.integrity >= 45) {
        titleTag.innerText = "🕊️ [END_B] 인간성 회복 — 침묵의 에덴";
        descTag.innerText = `최종 데이터 산출 ➔ Sync: ${state.sync}, Integrity: ${state.integrity}, Erosion: ${state.noise}\n\n축적된 인간성의 가치 조각들이 중앙 코어의 모순 연산을 기적적으로 정화했습니다. 소멸을 멈춘 도시는 안온하고 평화로운 침묵 속에 영원히 보존됩니다.`;
      } else {
        titleTag.innerText = "💀 [Bad End] \"도시가 정지했다\"";
        descTag.innerText = `최종 데이터 산출 ➔ Sync: ${state.sync}, Integrity: ${state.integrity}, Erosion: ${state.noise}\n\n기준 판정 수치 미달. 도시를 재구동하거나 해방할 그 어떤 가치 파동도 증명해내지 못했습니다. 중앙 인과율 통제 프로토콜에 의해 연회가 강제 종료되며, 모든 스캔라인이 암흑 속으로 사라지고 회로가 차갑게 얼어붙습니다.`;
      }
    }

    function resetGame() {
      state = { sync: 0, integrity: 0, noise: 0, s2a: false, s3a: false, key: false, currentStage: "S1" };
      document.getElementById('ending-screen').classList.add('hidden');
      document.getElementById('opening-title-screen').style.display = 'flex';
    }
  </script>
</body>
</html>
